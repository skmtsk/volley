<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="バレー記録">
<meta name="theme-color" content="#1F4E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>バレー記録</title>
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#1B2430;--sub:#5B6675;--line:#E2E6EC;--pri:#1F4E78;--pri2:#2563A8;--gain:#18794E;--gainBg:#E3F3EA;--loss:#B93A26;--lossBg:#FBE8E3;--neu:#5B6675;--neuBg:#ECEFF3;--warn:#8A5A00;--warnBg:#FFF1D6;--court:#E8D6B0;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0F1419;--card:#1A2129;--ink:#E7ECF2;--sub:#9AA6B4;--line:#2A333E;--pri:#7FB0E6;--pri2:#2F6FB5;--gain:#5ACB91;--gainBg:#15301F;--loss:#F08B77;--lossBg:#3A1E18;--neu:#A3ACB8;--neuBg:#252D37;--warn:#F0BE5C;--warnBg:#3A2D12;--court:#4A3F2C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
#app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 28px}
h1{font-size:22px;margin:0;line-height:1.3}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--sub);font-weight:600}
p{margin:6px 0}
.sub{color:var(--sub);font-size:13px}
.top{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--neuBg);font-weight:600;font-size:15px}
.btn.pri{background:var(--pri2);color:#fff}
.btn.danger{background:var(--lossBg);color:var(--loss)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.back{font-weight:600;color:var(--pri);padding:8px 4px;min-height:44px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px;width:100%}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--pri2)}
label.f{display:block;margin:10px 0 0}
label.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.seg{display:flex;background:var(--neuBg);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;color:var(--sub);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px}
.tabs button{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;background:var(--neuBg);font-weight:600;font-size:14px;color:var(--sub)}
.tabs button.on{background:var(--pri2);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neuBg);color:var(--sub)}
.pill.g{background:var(--gainBg);color:var(--gain)}.pill.l{background:var(--lossBg);color:var(--loss)}.pill.w{background:var(--warnBg);color:var(--warn)}
.mcard{display:block;width:100%;text-align:left}
.mcard .t{font-weight:700;font-size:16px;margin:2px 0}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
/* scoreboard */
.board{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 -16px;padding:calc(env(safe-area-inset-top) + 6px) 16px 8px}
.sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.sc .team{font-size:12px;color:var(--sub);font-weight:600}
.sc .num{font-size:44px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.sc .mid{text-align:center;padding:0 10px;font-size:13px;color:var(--sub);font-weight:600}
.sc .r{text-align:right}
.srv{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:14px;flex-wrap:wrap}
.srv .who{font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gain);margin-right:4px;vertical-align:1px}
.dot.o{background:var(--loss)}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.ptitle b{font-size:14px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{min-height:50px;border-radius:12px;padding:7px 10px;font-weight:700;font-size:15px;text-align:left;line-height:1.25}
.pbtn small{display:block;font-weight:500;font-size:11px;opacity:.75}
.pbtn.g{background:var(--gainBg);color:var(--gain)}
.pbtn.l{background:var(--lossBg);color:var(--loss)}
.pbtn.n{background:var(--neuBg);color:var(--ink)}
.pbtn.dim{opacity:.5}
.pane .pbtn{min-height:44px;font-size:14px}
.evhead{background:var(--neuBg);border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.pbtn:active,.chip:active,.btn:active{transform:scale(.97)}
.banner{border-radius:var(--r);padding:12px 14px;margin:10px 0;font-weight:600}
.banner.g{background:var(--gainBg);color:var(--gain)}.banner.w{background:var(--warnBg);color:var(--warn)}.banner.n{background:var(--neuBg)}
.log{list-style:none;margin:0;padding:0}
.log li button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.log .s{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px}
.log .k{flex:1}
.log .g{color:var(--gain)}.log .l{color:var(--loss)}
/* sheet */
.shbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.pane{background:var(--card);width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.pane h2{margin:0 0 4px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.chip{min-height:60px;border-radius:12px;background:var(--neuBg);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}
.chip small{font-weight:500;color:var(--sub);font-size:11px}
.chip.srv{outline:2px solid var(--pri2)}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .l{font-size:12px;color:var(--sub);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .d{font-size:12px;color:var(--sub)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.2em;gap:8px;align-items:center;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:12px;background:var(--neuBg);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .fill.g{background:var(--gain)}.bar .fill.l{background:var(--loss)}
.bar .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar.grp{font-weight:700}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--neuBg);font-weight:600;color:var(--sub);font-size:11px;white-space:normal;min-width:3.4em}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{background:var(--neuBg)}
tr.tot td{font-weight:700;background:var(--neuBg)}
td.g{color:var(--gain);font-weight:700}td.l{color:var(--loss);font-weight:700}
/* court */
.court{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:var(--court);padding:8px;border-radius:12px}
.net{grid-column:1/-1;height:8px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 7px);opacity:.55}
.cell{background:var(--card);border-radius:9px;min-height:56px;font-size:10px;text-align:center;padding:4px 2px;display:flex;flex-direction:column;justify-content:center;color:var(--sub);line-height:1.25}
.cell b{font-size:13px;color:var(--ink)}
.cell.on{outline:2px solid var(--gain)}
.gap{visibility:hidden}
.olist{display:grid;grid-template-columns:2.2em 1fr;gap:4px 8px;align-items:center}
.olist .no{font-weight:800;text-align:center;background:var(--neuBg);border-radius:8px;padding:4px 0}
.ok{color:var(--gain);font-weight:700}.ng{color:var(--loss);font-weight:700}
.prow{display:grid;grid-template-columns:4.2em 1fr 1fr 40px;gap:6px;align-items:center;margin-bottom:6px}
.x{min-height:44px;color:var(--loss);font-weight:700}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav#nav button{flex:1;padding:7px 0 5px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}
nav#nav button.on{color:var(--pri2)}
nav#nav svg{width:24px;height:24px}
.print-only{display:none}
@media print{
 nav#nav,.noprint,#toast{display:none!important}
 body{padding:0;background:#fff;color:#000}
 #app{padding:0;max-width:none}
 .card,.kpi,.tbl{break-inside:avoid;border-color:#ccc}
 .tbl{overflow:visible}
 .print-only{display:block}
 .board{position:static}
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" class="noprint"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script>
'use strict';
const APPV='1.1.0';
const STORE='volleyRec.v1';
const POS9=['レフト','中打ち(レフト)','セッター','中打ち(ライト)','ライト','ハーフ','バックレフト','バックセンター','バックライト'];
// key, label, 得失, 分類, 選手入力(req=必須/opt=任意/auto=サーバー自動/none=不要/sub), 表示(any/self=自サーブ中/opp=相手サーブ中), 限定(nine/practice)
const PLAYS=[
 ['spike','スパイク決定','得','決定','req','any'],
 ['feint','フェイント・押し込み','得','決定','req','any'],
 ['block','ブロック決定','得','決定','req','any'],
 ['blockout','ブロックアウト決定','得','決定','req','any'],
 ['ace','サーブ得点(エース)','得','決定','auto','self'],
 ['o_serve','相手サーブミス','得','相手ミス','none','opp'],
 ['o_spike','相手スパイクミス','得','相手ミス','none','any'],
 ['o_recv','相手レシーブミス','得','相手ミス','none','any'],
 ['o_foul','相手反則(ネット等)','得','相手ミス','none','any'],
 ['o_other','相手その他ミス','得','相手ミス','none','any'],
 ['o_ace','相手サービスエース','失','被決定','opt','opp'],
 ['r_serve','サーブレシーブミス','失','自ミス','req','opp'],
 ['r_spike','スパイクレシーブミス','失','自ミス','req','any'],
 ['r_other','その他のレシーブミス','失','自ミス','req','any'],
 ['serve_miss','サーブミス','失','自ミス','auto','self'],
 ['spike_miss','スパイクミス(アウト・ネット)','失','自ミス','req','any'],
 ['connect','つなぎ・トスミス','失','自ミス','req','any'],
 ['foul','自反則(ネットタッチ等)','失','自ミス','opt','any'],
 ['blocked','被ブロック(止められた)','失','被決定','opt','any'],
 ['blockout_x','被ブロックアウト','失','被決定','opt','any'],
 ['spiked','被スパイク決定','失','被決定','opt','any'],
 ['feinted','被フェイント決定','失','被決定','opt','any'],
 ['l_other','その他(失点)','失','その他','opt','any'],
 ['serve1','サーブ1本目ミス','—','記録のみ','auto','any','nine'],
 ['sub','メンバー交代','—','','sub','any'],
 ['set_end','セット終了(時間切れ等)','—','','none','any','practice']
];
const P={};PLAYS.forEach(a=>P[a[0]]={k:a[0],label:a[1],res:a[2],cls:a[3],need:a[4],ctx:a[5],only:a[6]||''});
const GAIN=PLAYS.filter(a=>a[2]==='得').map(a=>a[0]);
const LOSS=PLAYS.filter(a=>a[2]==='失').map(a=>a[0]);
const SCORE_K=['spike','feint','block','blockout','ace'];
const MISS_K=['serve_miss','r_serve','r_spike','r_other','spike_miss','connect','foul'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pct=(a,b)=>b?(Math.round(a/b*1000)/10).toFixed(1)+'%':'-';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>s?String(s).replace(/-/g,'/'):'';
const isNine=m=>m.rule!=='six';
const N=m=>isNine(m)?9:6;
const plabel=(k,nine)=>k==='serve_miss'?(nine?'サーブ2本目ミス':'サーブミス'):(P[k]?P[k].label:k);
const ruleLabel=m=>(isNine(m)?'9人制':'6人制小学生')+' '+(m.kind==='official'?'公式戦':'練習試合');

/* ---------- storage ---------- */
function blankDB(){return {v:1,team:'',players:[],matches:[]}}
function load(){try{const s=localStorage.getItem(STORE);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.matches))return Object.assign(blankDB(),d);}}catch(e){}return blankDB();}
let DB=load();
let saveFail=false;
function save(){try{localStorage.setItem(STORE,JSON.stringify(DB));saveFail=false;}catch(e){if(!saveFail)toast('保存できませんでした。データの保存先を確認してください');saveFail=true;}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- match helpers ---------- */
const nmCache=new WeakMap();
function nm(m,id){if(!id)return '';let c=nmCache.get(m);if(!c||c._n!==m.members.length){c=new Map();c._n=m.members.length;m.members.forEach(p=>c.set(p.id,p.name));nmCache.set(m,c);}return c.get(id)||'(不明)';}
function mem(m,id){return m.members.find(p=>p.id===id)}
function numOf(m,id){const p=mem(m,id);return p&&p.num!==''&&p.num!=null?'#'+p.num:''}
function setOpp(m,i){const s=m.sets[i];return (m.kind==='practice'&&s&&s.opp)||m.opp||''}
function deuceOf(m,i){return m.kind==='official'?true:!!(m.sets[i]&&m.sets[i].deuce)}
function blankSet(m,i,prev){const n=N(m);const s={target:m.kind==='official'?(i===2?15:21):21,first:i%2?'相':'自',deuce:m.kind==='official',opp:'',order:Array(n).fill(''),pos:isNine(m)?Array(9).fill(''):[]};if(prev){s.target=prev.target;s.deuce=prev.deuce;s.opp=prev.opp;s.order=prev.order.slice();s.pos=(prev.pos||[]).slice();s.first=prev.first==='自'?'相':'自';}return s;}
function initSet(m,i){const s=m.sets[i]||{};return {si:i,set:i+1,side:s.first==='相'?'相':'自',slot:1,us:0,them:0,order:(s.order||[]).slice(),pos:(s.pos||[]).slice(),ended:false}}
function needWins(m){return Math.ceil(m.sets.length/2)}

function replay(m){
 const n=N(m),rows=[],sums=[];let st=initSet(m,0),w=0,l=0,over=false,orphan=0;
 const closeSet=()=>{const r=st.us>st.them?'○':st.us<st.them?'×':'△';sums.push({si:st.si,set:st.set,opp:setOpp(m,st.si),us:st.us,them:st.them,done:true,res:r});if(r==='○')w++;else if(r==='×')l++;if(m.kind==='official'&&(w>=needWins(m)||l>=needWins(m)))over=true;};
 for(let i=0;i<m.events.length;i++){
  const ev=m.events[i];
  if(st.ended){if(over||st.si+1>=m.sets.length){orphan++;continue;}st=initSet(m,st.si+1);}
  const p=P[ev.k];if(!p)continue;
  const server=st.side==='自'?(st.order[st.slot-1]||''):'';
  let who=ev.p||'';
  if(!who&&p.need==='auto'&&st.side==='自')who=server;
  const row={i,m,ord:st.order.slice(),posB:st.pos.slice(),k:ev.k,res:p.res,cls:p.cls,set:st.set,si:st.si,opp:setOpp(m,st.si),side:st.side,slot:st.slot,server,who,inn:ev.in||'',memo:ev.memo||''};
  if(ev.k==='sub'){row.who='';row.out=ev.p||'';const a=st.order.indexOf(ev.p);if(a>=0&&ev.in&&st.order.indexOf(ev.in)<0){st.order[a]=ev.in;const b=st.pos.indexOf(ev.p);if(b>=0)st.pos[b]=ev.in;}else row.bad=true;}
  if(p.res==='得')st.us++;else if(p.res==='失')st.them++;
  if(p.res==='失'&&st.side==='自')st.slot=st.slot%n+1;
  if(p.res==='得')st.side='自';else if(p.res==='失')st.side='相';
  row.us=st.us;row.them=st.them;
  const tg=+(m.sets[st.si]&&m.sets[st.si].target)||21;
  if(ev.k==='set_end'||(Math.max(st.us,st.them)>=tg&&(!deuceOf(m,st.si)||Math.abs(st.us-st.them)>=2))){st.ended=true;row.setEnd=true;closeSet();}
  rows.push(row);
 }
 if(!st.ended&&rows.some(r=>r.si===st.si))sums.push({si:st.si,set:st.set,opp:setOpp(m,st.si),us:st.us,them:st.them,done:false,res:'途中'});
 let cur=st,needSet=false;
 if(st.ended&&!over){if(st.si+1<m.sets.length)cur=initSet(m,st.si+1);else needSet=true;}
 cur.server=cur.side==='自'?(cur.order[cur.slot-1]||''):'';
 cur.next=cur.side==='自'?(cur.order[cur.slot%n]||''):(cur.order[cur.slot-1]||'');
 return {rows,sums,cur,over,needSet,w,l,orphan,lastRow:rows[rows.length-1]};
}
function resultLabel(m,R){
 if(!m.events.length)return '未記録';
 if(m.kind==='official')return R.over?`${R.w}-${R.l} ${R.w>R.l?'勝ち':'負け'}`:`${R.w}-${R.l} 試合中`;
 const dr=R.sums.filter(s=>s.res==='△').length;return `${R.w}勝${R.l}敗${dr?dr+'分':''}`;
}
function orderReady(m,si){const s=m.sets[si];if(!s)return false;const n=N(m);const o=s.order.filter(Boolean);if(o.length!==n||new Set(o).size!==n)return false;return true;}
function posCheck(m,si){if(!isNine(m))return true;const s=m.sets[si];const a=(s.pos||[]).filter(Boolean),b=s.order.filter(Boolean);if(a.length!==9||new Set(a).size!==9)return false;return a.every(x=>b.includes(x));}
function oppsOf(m){const o=new Set();if(m.kind==='practice')m.sets.forEach((s,i)=>{const x=setOpp(m,i);if(x)o.add(x)});else if(m.opp)o.add(m.opp);return [...o];}

/* ---------- stats ---------- */
function calc(rows){
 const S={us:0,them:0,so:0,soT:0,br:0,brT:0,k:{},cls:{},pl:{},slot:{},s1self:0,s1opp:0};
 const pl=name=>S.pl[name]||(S.pl[name]={name,k:{},srvT:0,srvW:0});
 for(const r of rows){
  S.k[r.k]=(S.k[r.k]||0)+1;
  if(r.k==='serve1'){if(r.side==='自')S.s1self++;else S.s1opp++;}
  if(r.res==='得'||r.res==='失'){
   if(r.res==='得')S.us++;else S.them++;
   S.cls[r.cls]=(S.cls[r.cls]||0)+1;
   const sl=S.slot[r.slot]||(S.slot[r.slot]={so:0,soT:0,br:0,brT:0});
   if(r.side==='相'){S.soT++;sl.soT++;if(r.res==='得'){S.so++;sl.so++;}}else{S.brT++;sl.brT++;if(r.res==='得'){S.br++;sl.br++;}}
   if(r.server){const x=pl(nm(r.m,r.server));x.srvT++;if(r.res==='得')x.srvW++;}
  }
  if(r.who&&r.k!=='sub'){const x=pl(nm(r.m,r.who));x.k[r.k]=(x.k[r.k]||0)+1;}
 }
 Object.values(S.pl).forEach(x=>{x.score=SCORE_K.reduce((a,k)=>a+(x.k[k]||0),0);x.miss=MISS_K.reduce((a,k)=>a+(x.k[k]||0),0);});
 return S;
}
function kpi(l,v,d){return `<div class="kpi"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div>${d?`<div class="d">${esc(d)}</div>`:''}</div>`}
function bars(keys,S,total,cls,groups,nine){
 let h='<div class="bars">';
 groups.forEach(([lab,c])=>{const v=S.cls[c]||0;h+=`<div class="bar grp"><div class="lab">${esc(lab)}</div><div class="trk"><div class="fill ${cls}" style="width:${total?v/total*100:0}%"></div></div><div class="c">${v}</div></div>`;});
 h+='</div><div class="bars" style="margin-top:10px">';
 const items=keys.map(k=>[k,S.k[k]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 if(!items.length)h+='<div class="sub">記録なし</div>';
 items.forEach(([k,v])=>{h+=`<div class="bar"><div class="lab">${esc(plabel(k,nine))}</div><div class="trk"><div class="fill ${cls}" style="width:${total?v/total*100:0}%;opacity:.7"></div></div><div class="c">${v}</div></div>`;});
 return h+'</div>';
}
function pcols(nine){return [['得点','_score'],['スパイク','spike'],['フェイント','feint'],['ブロック','block'],['Bアウト','blockout'],['エース','ace'],...(nine?[['1本目ミス','serve1']]:[]),[nine?'2本目ミス':'サーブミス','serve_miss'],['サーブカットミス','r_serve'],['レシーブミス','_recv'],['スパイクミス','spike_miss'],['つなぎミス','connect'],['反則','foul'],['被ブロック','blocked'],['ミス計','_miss'],['得失差','_diff'],['サーブ本数','_srvT'],['サーブ中得点率','_srvP']];}
function pval(x,c){if(c==='_score')return x.score;if(c==='_miss')return x.miss;if(c==='_diff')return x.score-x.miss;if(c==='_srvT')return x.srvT;if(c==='_srvP')return pct(x.srvW,x.srvT);if(c==='_recv')return (x.k.r_spike||0)+(x.k.r_other||0);return x.k[c]||0;}
function ptable(S,nine,orderNames){
 let list=Object.values(S.pl);
 if(orderNames){const idx=n=>{const i=orderNames.indexOf(n);return i<0?999:i};list.sort((a,b)=>idx(a.name)-idx(b.name)||b.score-a.score);}
 else list.sort((a,b)=>b.score-a.score||a.miss-b.miss);
 if(!list.length)return '<div class="sub">選手の記録はまだありません</div>';
 const cols=pcols(nine);
 let h='<div class="tbl"><table><tr><th>選手</th>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'</tr>';
 const tot={name:'合計',k:{},srvT:0,srvW:0,score:0,miss:0};
 list.forEach(x=>{h+='<tr><td><b>'+esc(x.name)+'</b></td>'+cols.map(c=>{const v=pval(x,c[1]);const cl=c[1]==='_diff'?(v>0?'g':v<0?'l':''):'';return `<td class="${cl}">${v===0?'<span class="sub">0</span>':esc(v)}</td>`}).join('')+'</tr>';
  Object.keys(x.k).forEach(k=>tot.k[k]=(tot.k[k]||0)+x.k[k]);tot.srvT+=x.srvT;tot.srvW+=x.srvW;tot.score+=x.score;tot.miss+=x.miss;});
 h+='<tr class="tot"><td>合計</td>'+cols.map(c=>`<td>${esc(pval(tot,c[1]))}</td>`).join('')+'</tr>';
 return h+'</table></div><p class="sub">得点=スパイク・フェイント・ブロック・ブロックアウト・エース。ミス計=サーブ'+(nine?'2本目':'')+'ミス・サーブカット・レシーブ(スパイク/その他)・スパイク・つなぎ・反則'+(nine?'(1本目ミス・被ブロックは別枠)':'(被ブロックは別枠)')+'。</p>';
}
function slotTable(S,n,names){
 let h='<div class="tbl"><table><tr><th>サーブ順</th>'+(names?'<th>先発</th>':'')+'<th>サイドアウト率</th><th>サイドアウト</th><th>ブレイク率</th><th>ブレイク</th></tr>';
 for(let k=1;k<=n;k++){const s=S.slot[k]||{so:0,soT:0,br:0,brT:0};h+=`<tr><td><b>${k}番</b></td>${names?`<td>${esc(names[k-1]||'')}</td>`:''}<td><b>${pct(s.so,s.soT)}</b></td><td>${s.so}/${s.soT}</td><td><b>${pct(s.br,s.brT)}</b></td><td>${s.br}/${s.brT}</td></tr>`;}
 return h+'</table></div><p class="sub">サイドアウト=相手サーブ中に点を取ってサーブ権を取り返すこと。ブレイク=自チームのサーブ中に点を取ること。サーブ順の番号は、そのラリーのサーブ権(またはサイドアウト後のサーバー)の番号です。</p>';
}
function vStats(rows,sums,o){
 const S=calc(rows);let h='';
 h+=`<div class="kpis">${kpi('得点',S.us)}${kpi('失点',S.them)}${kpi('サイドアウト率',pct(S.so,S.soT),`相手サーブ ${S.soT}本中 ${S.so}`)}${kpi('ブレイク率',pct(S.br,S.brT),`自サーブ ${S.brT}本中 ${S.br}`)}</div>`;
 if(sums&&sums.length){
  h+='<h2>セット結果</h2><div class="tbl"><table><tr><th>'+(o.multi?'試合':'セット')+'</th>'+(o.showOpp?'<th>相手</th>':'')+'<th>スコア</th><th>結果</th></tr>';
  sums.forEach(s=>{h+=`<tr><td>${o.multi?esc(fmtD(s.date))+' ':''}第${s.set}セット</td>${o.showOpp?`<td>${esc(s.opp||'-')}</td>`:''}<td><b>${s.us} - ${s.them}</b></td><td class="${s.res==='○'?'g':s.res==='×'?'l':''}">${s.res}</td></tr>`;});
  h+='</table></div>';
 }
 h+='<h2>得点の内訳</h2><div class="card">'+bars(GAIN,S,S.us,'g',[['自チームで決めた','決定'],['相手のミス','相手ミス']],o.nine)+'</div>';
 h+='<h2>失点の内訳</h2><div class="card">'+bars(LOSS,S,S.them,'l',[['自チームのミス','自ミス'],['相手に決められた','被決定'],['その他','その他']],o.nine)+'</div>';
 h+='<h2>サーブ</h2><div class="kpis">'+kpi('サーブ得点(エース)',S.k.ace||0)+kpi(o.nine?'2本目ミス(失点)':'サーブミス(失点)',S.k.serve_miss||0)+(o.nine?kpi('自チーム 1本目ミス',S.s1self)+kpi('相手 1本目ミス',S.s1opp):'')+'</div>';
 h+='<h2>選手別</h2>'+ptable(S,o.nine,o.orderNames);
 h+='<h2>サーブ順別</h2>'+slotTable(S,o.n,o.slotNames);
 return h;
}
function summaryText(title,rows,sums,nine){
 const S=calc(rows);const L=[title];
 sums.forEach(s=>L.push(`第${s.set}セット ${s.us}-${s.them} ${s.res}${s.opp?' (vs '+s.opp+')':''}`));
 L.push(`得点${S.us} 失点${S.them}`);
 L.push(`サイドアウト率 ${pct(S.so,S.soT)} / ブレイク率 ${pct(S.br,S.brT)}`);
 L.push(`得点: 自分たちで決めた${S.cls['決定']||0} 相手ミス${S.cls['相手ミス']||0}`);
 L.push(`失点: 自分たちのミス${S.cls['自ミス']||0} 決められた${S.cls['被決定']||0}`);
 const top=Object.values(S.pl).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5);
 if(top.length)L.push('得点: '+top.map(x=>`${x.name}${x.score}`).join(' / '));
 const lk=LOSS.map(k=>[k,S.k[k]||0]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,3);
 if(lk.length)L.push('多かった失点: '+lk.map(([k,v])=>`${plabel(k,nine)}${v}`).join(' / '));
 return L.join('\n');
}

function aggRows(){
 const f=UI.agg;let rows=[],sums=[],mc=0;const opps=new Set();
 DB.matches.forEach(m=>{
  if(f.rule!=='all'&&m.rule!==f.rule)return;
  if(f.kind!=='all'&&m.kind!==f.kind)return;
  if(f.from&&(m.date||'')<f.from)return;
  if(f.to&&(m.date||'')>f.to)return;
  const R=replay(m);R.rows.forEach(r=>{if(r.opp)opps.add(r.opp)});
  let rr=R.rows,ss=R.sums.map(s=>Object.assign({date:m.date,m},s));
  if(f.opp){rr=rr.filter(r=>r.opp===f.opp);ss=ss.filter(s=>s.opp===f.opp);}
  if(rr.length)mc++;rows=rows.concat(rr);sums=sums.concat(ss);
 });
 return {rows,sums,mc,opps:[...opps].sort()};
}

 if(s.mode==='edit'){m.events[s.i]=Object.assign({},m.events[s.i],{k,p:p||null,in:inn||null});msg='変更しました';}
 else if(s.mode==='editP'){const ev=m.events[s.i];ev.p=p||null;if(ev.k==='sub')ev.in=inn||null;msg='選手を変更しました';}
 else{m.events.splice(s.at,0,{k,p:p||null,in:inn||null,t:Date.now()});msg='追加しました';}
 touch(m);UI.sheet=null;render();toast(msg);
}
function openSheet(o){UI.sheet=o;renderSheet();}
function closeSheet(){UI.sheet=null;renderSheet();}

/* ---------- actions ---------- */
function commit(k,p,inn){const m=curM();m.events.push({k,p:p||null,in:inn||null,t:Date.now()});touch(m);UI.sheet=null;render();
 const R=replay(m),r=R.lastRow;if(!r)return;const who=r.k==='sub'?`${nm(m,r.out)}→${nm(m,r.inn)}`:nm(m,r.who);
 toast(`${r.res==='得'?'＋1 ':r.res==='失'?'相手＋1 ':''}${plabel(k,isNine(m))}${who?' '+who:''}  ${r.us}-${r.them}`);}
function newMatchObj(rule,kind){
 const m={id:uid(),rule,kind,date:today(),title:'',opp:'',members:DB.players.map(p=>({id:p.id,num:p.num,name:p.name,pos:p.pos||''})),sets:[],events:[],created:Date.now(),updated:Date.now()};
 const cnt=kind==='official'?3:1;for(let i=0;i<cnt;i++)m.sets.push(blankSet(m,i));
 const prev=DB.matches.filter(x=>x.rule===rule).sort((a,b)=>b.created-a.created)[0];
 if(prev&&prev.sets[0]){const ids=new Set(m.members.map(p=>p.id));const ok=id=>ids.has(id)?id:'';m.sets.forEach(s=>{s.order=prev.sets[0].order.map(ok);if(isNine(m))s.pos=(prev.sets[0].pos||[]).map(ok);});}
 return m;
}
function shareFile(name,text,mime){
 const blob=new Blob([text],{type:mime});
 try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return;}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function shareText(t){if(navigator.share){navigator.share({text:t}).catch(()=>{});return;}try{navigator.clipboard.writeText(t);toast('コピーしました');}catch(e){prompt('コピーしてください',t);}}
const fileSafe=s=>String(s||'').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40);
function matchPayload(ms){return JSON.stringify({app:'volley-rec',v:1,type:'matches',exported:Date.now(),matches:ms.map(m=>{const c=Object.assign({},m);return c;})});}
function csvOf(ms){
 const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const L=[['日付','試合','種類','セット','相手','No','プレー','得失','分類','選手','入った選手','サーバー','サーブ順','サーブ側','自','相'].join(',')];
 ms.forEach(m=>{replay(m).rows.forEach((r,j)=>{L.push([fmtD(m.date),m.title,ruleLabel(m),r.set,r.opp,j+1,plabel(r.k,isNine(m)),r.res,r.cls,r.k==='sub'?nm(m,r.out):nm(m,r.who),r.k==='sub'?nm(m,r.inn):'',nm(m,r.server),r.slot,r.side,r.us,r.them].map(q).join(','));});});
 return '﻿'+L.join('\n');
}
function importData(d){
 if(!d||d.app!=='volley-rec'||!Array.isArray(d.matches))throw new Error('このアプリのファイルではありません');
 let add=0,rep=0,skip=0;
 d.matches.forEach(m=>{if(!m||!m.id||!Array.isArray(m.events)||!Array.isArray(m.sets)||!Array.isArray(m.members)){skip++;return;}
  const i=DB.matches.findIndex(x=>x.id===m.id);if(i<0){DB.matches.push(m);add++;}else if((m.updated||0)>(DB.matches[i].updated||0)){DB.matches[i]=m;rep++;}else skip++;});
 if(Array.isArray(d.players)){d.players.forEach(p=>{if(p&&p.name&&!DB.players.some(x=>x.name===p.name))DB.players.push({id:p.id||uid(),num:p.num??'',name:p.name,pos:p.pos||''});});}
 if(d.team&&!DB.team)DB.team=d.team;
 save();return {add,rep,skip};
}
let wakeLock=null;
async function setWake(on){UI.wake=on;try{if(on&&'wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}else if(wakeLock){await wakeLock.release();wakeLock=null;}}catch(e){if(on){UI.wake=false;toast('この端末では使えません');}}render();}
document.addEventListener('visibilitychange',()=>{if(UI.wake&&document.visibilityState==='visible')setWake(true);});

const ACT={
 nav:e=>{UI.tab=e.dataset.v;UI.sheet=null;window.scrollTo(0,0);render();},
 goHome:()=>{UI.tab='home';render();},
 newMatch:()=>openSheet({type:'newMatch',rule:(DB.matches[DB.matches.length-1]||{}).rule||'nine',kind:'official'}),
 nmRule:e=>{UI.sheet.rule=e.dataset.v;renderSheet();},
 nmKind:e=>{UI.sheet.kind=e.dataset.v;renderSheet();},
 createMatch:()=>{const m=newMatchObj(UI.sheet.rule,UI.sheet.kind);DB.matches.push(m);save();UI.mid=m.id;UI.tab='match';UI.mtab='setup';UI.open=0;UI.sheet=null;render();},
 openMatch:e=>{UI.mid=e.dataset.id;UI.tab='match';const m=curM();UI.mtab=m&&m.events.length&&replay(m).over?'ana':(m&&m.events.length?'rec':'setup');UI.aset='all';UI.open=0;window.scrollTo(0,0);render();},
 mtab:e=>{UI.mtab=e.dataset.v;window.scrollTo(0,0);render();},
 aset:e=>{UI.aset=e.dataset.v;render();},
 play:e=>{const k=e.dataset.k,p=P[k];if(p.need==='req'||p.need==='opt')openSheet({type:'pick',k});else if(p.need==='sub')openSheet({type:'subOut'});else commit(k);},
 pickP:e=>applyEv(UI.sheet,UI.sheet.k,e.dataset.id||null),
 subOut:e=>openSheet(Object.assign({},UI.sheet,{type:'subIn',out:e.dataset.id})),
 subIn:e=>applyEv(UI.sheet,'sub',UI.sheet.out,e.dataset.id),
 pp:e=>{const k=e.dataset.k,p=P[k],s=UI.sheet;if(p.need==='req'||p.need==='opt')openSheet(Object.assign({},s,{type:'pick',k}));else if(p.need==='sub')openSheet(Object.assign({},s,{type:'subOut'}));else applyEv(s,k,null,null);},
 evEditK:()=>openSheet({type:'playPick',mode:'edit',i:UI.sheet.i}),
 evEditP:()=>{const m=curM(),i=UI.sheet.i,ev=m.events[i];if(ev.k==='sub')openSheet({type:'subOut',mode:'editP',i});else openSheet({type:'pick',k:ev.k,mode:'editP',i});},
 evIns:e=>openSheet({type:'playPick',mode:'ins',at:+e.dataset.at}),
 logAll:()=>{UI.logAll=!UI.logAll;render();},
 closeSheet:()=>closeSheet(),
 bgClose:(e,ev)=>{if(ev.target===e)closeSheet();},
 undo:()=>{const m=curM();if(!m.events.length)return;const R=replay(m);const r=R.lastRow;m.events.pop();touch(m);render();toast('取り消しました'+(r?': '+plabel(r.k,isNine(m)):''));},
 wake:()=>setWake(!UI.wake),
 evMenu:e=>openSheet({type:'ev',i:+e.dataset.i}),
 delEv:e=>{const m=curM();m.events.splice(+e.dataset.i,1);touch(m);UI.sheet=null;render();toast('削除しました');},
 addSet:()=>{const m=curM();const prev=m.sets[m.sets.length-1];m.sets.push(blankSet(m,m.sets.length,prev));touch(m);UI.open=m.sets.length-1;if(UI.mtab!=='setup'){UI.mtab='rec';}render();toast(`第${m.sets.length}セットを追加しました`);},
 delSet:e=>{const m=curM();if(!confirm('このセットを削除しますか?'))return;m.sets.splice(+e.dataset.i,1);touch(m);UI.open=-1;render();},
 gotoSetup:e=>{UI.mtab='setup';UI.open=+e.dataset.si;render();},
 openSet:e=>{const i=+e.dataset.i;UI.open=UI.open===i?-1:i;render();},
 sfirst:e=>{const m=curM();m.sets[+e.dataset.i].first=e.dataset.v;touch(m);render();},
 sdeuce:e=>{const m=curM();m.sets[+e.dataset.i].deuce=e.dataset.v==='1';touch(m);render();},
 copyPrev:e=>{const m=curM(),i=+e.dataset.i;m.sets[i].order=m.sets[i-1].order.slice();m.sets[i].pos=(m.sets[i-1].pos||[]).slice();touch(m);render();},
 setRule:e=>{const m=curM();if(m.events.length)return;m.rule=e.dataset.v;m.sets=m.sets.map((s,i)=>blankSet(m,i));touch(m);render();},
 setKind:e=>{const m=curM();if(m.events.length)return;m.kind=e.dataset.v;const cnt=m.kind==='official'?3:1;const old=m.sets;m.sets=[];for(let i=0;i<cnt;i++){const s=blankSet(m,i);if(old[i]){s.order=old[i].order;s.pos=old[i].pos;}m.sets.push(s);}touch(m);render();},
 addGuest:()=>{const m=curM();const v=($('#guestName').value||'').trim();if(!v)return;if(m.members.some(p=>p.name===v)){toast('同じ名前がいます');return;}m.members.push({id:uid(),num:'',name:v,pos:''});touch(m);render();},
 delMatch:()=>{const m=curM();if(!confirm(`「${m.title||'この試合'}」を削除しますか?元に戻せません。`))return;DB.matches=DB.matches.filter(x=>x.id!==m.id);save();UI.tab='home';render();},
 sendMatch:()=>{const m=curM();shareFile(`試合_${fmtD(m.date).replace(/\//g,'')}_${fileSafe(m.title||m.opp)}.json`,matchPayload([m]),'application/json');},
 csvMatch:()=>{const m=curM();shareFile(`記録_${fmtD(m.date).replace(/\//g,'')}_${fileSafe(m.title)}.csv`,csvOf([m]),'text/csv');},
 shareText:()=>{const m=curM();const R=replay(m);const sel=UI.aset==='all'?null:+UI.aset;const rows=sel===null?R.rows:R.rows.filter(r=>r.si===sel);const sums=sel===null?R.sums:R.sums.filter(s=>s.si===sel);
  shareText(summaryText(`【${fmtD(m.date)} ${m.title||''}】${oppsOf(m).length?' vs '+oppsOf(m).join('・'):''} ${resultLabel(m,R)}`,rows,sums,isNine(m)));},
 shareOrder:()=>{const m=curM();const L=[`【オーダー ${fmtD(m.date)} ${m.title||''}】`];m.sets.forEach((s,i)=>{L.push(`■第${i+1}セット${setOpp(m,i)?' vs '+setOpp(m,i):''}(${s.first==='自'?'自チーム':'相手'}サーブから)`);L.push('サーブ順: '+s.order.map((id,k)=>`${k+1}.${nm(m,id)||'-'}`).join(' '));if(isNine(m))L.push('配置: '+POS9.map((p,k)=>`${p}=${nm(m,s.pos[k])||'-'}`).join(' / '));});shareText(L.join('\n'));},
 shareAgg:()=>{const A=aggRows();const f=UI.agg;shareText(summaryText(`【集計 ${(f.from||f.to)?(fmtD(f.from)||'最初')+'〜'+(fmtD(f.to)||'今日'):'全期間'}${f.opp?' vs '+f.opp:''}】${A.mc}試合`,A.rows,[],f.rule!=='six'));},
 print:()=>{try{window.print();}catch(e){toast('印刷できませんでした');}},
 af:e=>{UI.agg[e.dataset.k]=e.dataset.v;render();},
 period:e=>{const d=new Date(),f=UI.agg,v=e.dataset.v,ym=(y,m)=>`${y}-${String(m).padStart(2,'0')}-01`;if(v==='all'){f.from='';f.to='';}else if(v==='m1'){f.from=ym(d.getFullYear(),d.getMonth()+1);f.to='';}else if(v==='m3'){const x=new Date(d.getFullYear(),d.getMonth()-2,1);f.from=ym(x.getFullYear(),x.getMonth()+1);f.to='';}else{f.from=`${d.getFullYear()}-01-01`;f.to='';}render();},
 addPlayer:()=>{const mx=DB.players.reduce((a,p)=>Math.max(a,+p.num||0),0);DB.players.push({id:uid(),num:mx+1,name:'選手'+(DB.players.length+1),pos:''});save();render();},
 delPlayer:e=>{const p=DB.players.find(x=>x.id===e.dataset.id);if(!confirm(`${p.name} を削除しますか?(過去の試合の記録は残ります)`))return;DB.players=DB.players.filter(x=>x!==p);save();render();},
 pickFile:()=>$('#fileIn').click(),
 backup:()=>shareFile(`バレー記録_バックアップ_${today().replace(/-/g,'')}.json`,JSON.stringify({app:'volley-rec',v:1,type:'backup',exported:Date.now(),team:DB.team,players:DB.players,matches:DB.matches}),'application/json'),
 csvAll:()=>shareFile(`バレー記録_全記録_${today().replace(/-/g,'')}.csv`,csvOf(DB.matches),'text/csv'),
 wipe:()=>{if(!confirm('すべての試合とメンバーを削除します。よろしいですか?'))return;if(!confirm('本当に削除しますか?元に戻せません。'))return;DB=blankDB();save();render();},
};
const CH={
 mf:e=>{const m=curM();m[e.dataset.k]=e.value.trim?e.value.trim():e.value;touch(m);render();},
 sf:e=>{const m=curM(),s=m.sets[+e.dataset.i];s[e.dataset.k]=e.dataset.k==='target'?Math.max(1,parseInt(e.value)||21):e.value.trim();touch(m);render();},
 sord:e=>{const m=curM();m.sets[+e.dataset.i].order[+e.dataset.k]=e.value;touch(m);render();},
 spos:e=>{const m=curM();m.sets[+e.dataset.i].pos[+e.dataset.k]=e.value;touch(m);render();},
 memToggle:e=>{const m=curM(),id=e.dataset.id;if(e.checked){const p=DB.players.find(x=>x.id===id);if(p&&!m.members.some(x=>x.id===id))m.members.push({id:p.id,num:p.num,name:p.name,pos:p.pos||''});}else{const used=m.events.some(v=>v.p===id||v.in===id)||m.sets.some(s=>s.order.includes(id)||(s.pos||[]).includes(id));if(used){toast('記録やサーブ順で使われているので外せません');e.checked=true;return;}m.members=m.members.filter(x=>x.id!==id);}touch(m);render();},
 af:e=>{UI.agg[e.dataset.k]=e.value;render();},
 team:e=>{DB.team=e.value;save();},
 pf:e=>{const p=DB.players.find(x=>x.id===e.dataset.id);if(!p)return;const k=e.dataset.k;let v=e.value.trim();if(k==='name'){if(!v){render();return;}if(DB.players.some(x=>x!==p&&x.name===v)){toast('同じ名前がいます');render();return;}}if(k==='num')v=v===''?'':(isNaN(+v)?v:+v);p[k]=v;save();},
};
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(!e)return;if(e.dataset.act!=='bgClose'&&ev.target.closest('[data-stop]')&&!e.closest('[data-stop]'))return;const f=ACT[e.dataset.act];if(f){if(e.dataset.act==='bgClose'&&ev.target!==e)return;f(e,ev);}});
document.addEventListener('change',ev=>{const e=ev.target.closest('[data-ch]');if(!e)return;const f=CH[e.dataset.ch];if(f)f(e,ev);});
$('#fileIn').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const r=importData(JSON.parse(await f.text()));toast(`読み込みました: 追加${r.add}・更新${r.rep}${r.skip?'・変更なし'+r.skip:''}`);render();}catch(e){toast('読み込めませんでした: '+e.message);}});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
</script>
