<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="バレー記録">
<meta name="theme-color" content="#1F4E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>バレー記録</title>
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#1B2430;--sub:#5B6675;--line:#E2E6EC;--pri:#1F4E78;--pri2:#2563A8;--gain:#18794E;--gainBg:#E3F3EA;--loss:#B93A26;--lossBg:#FBE8E3;--neu:#5B6675;--neuBg:#ECEFF3;--warn:#8A5A00;--warnBg:#FFF1D6;--court:#E8D6B0;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0F1419;--card:#1A2129;--ink:#E7ECF2;--sub:#9AA6B4;--line:#2A333E;--pri:#7FB0E6;--pri2:#2F6FB5;--gain:#5ACB91;--gainBg:#15301F;--loss:#F08B77;--lossBg:#3A1E18;--neu:#A3ACB8;--neuBg:#252D37;--warn:#F0BE5C;--warnBg:#3A2D12;--court:#4A3F2C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
#app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 28px}
h1{font-size:22px;margin:0;line-height:1.3}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--sub);font-weight:600}
p{margin:6px 0}
.sub{color:var(--sub);font-size:13px}
.top{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--neuBg);font-weight:600;font-size:15px}
.btn.pri{background:var(--pri2);color:#fff}
.btn.danger{background:var(--lossBg);color:var(--loss)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.back{font-weight:600;color:var(--pri);padding:8px 4px;min-height:44px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px;width:100%}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--pri2)}
label.f{display:block;margin:10px 0 0}
label.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.seg{display:flex;background:var(--neuBg);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;color:var(--sub);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px}
.tabs button{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;background:var(--neuBg);font-weight:600;font-size:14px;color:var(--sub)}
.tabs button.on{background:var(--pri2);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neuBg);color:var(--sub)}
.pill.g{background:var(--gainBg);color:var(--gain)}.pill.l{background:var(--lossBg);color:var(--loss)}.pill.w{background:var(--warnBg);color:var(--warn)}
.mcard{display:block;width:100%;text-align:left}
.mcard .t{font-weight:700;font-size:16px;margin:2px 0}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
/* scoreboard */
.board{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 -16px;padding:calc(env(safe-area-inset-top) + 6px) 16px 8px}
.sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.sc .team{font-size:12px;color:var(--sub);font-weight:600}
.sc .num{font-size:44px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.sc .mid{text-align:center;padding:0 10px;font-size:13px;color:var(--sub);font-weight:600}
.sc .r{text-align:right}
.srv{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:14px;flex-wrap:wrap}
.srv .who{font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gain);margin-right:4px;vertical-align:1px}
.dot.o{background:var(--loss)}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.ptitle b{font-size:14px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{min-height:50px;border-radius:12px;padding:7px 10px;font-weight:700;font-size:15px;text-align:left;line-height:1.25}
.pbtn small{display:block;font-weight:500;font-size:11px;opacity:.75}
.pbtn.g{background:var(--gainBg);color:var(--gain)}
.pbtn.l{background:var(--lossBg);color:var(--loss)}
.pbtn.n{background:var(--neuBg);color:var(--ink)}
.pbtn.dim{opacity:.5}
.pbtn.dimno{outline:2px solid currentColor}
.pane .pbtn{min-height:44px;font-size:14px}
.evhead{background:var(--neuBg);border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.pbtn:active,.chip:active,.btn:active{transform:scale(.97)}
.banner{border-radius:var(--r);padding:12px 14px;margin:10px 0;font-weight:600}
.banner.g{background:var(--gainBg);color:var(--gain)}.banner.w{background:var(--warnBg);color:var(--warn)}.banner.n{background:var(--neuBg)}
.log{list-style:none;margin:0;padding:0}
.log li button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.log .s{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px}
.log .k{flex:1}
.log .g{color:var(--gain)}.log .l{color:var(--loss)}
/* sheet */
.shbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.pane{background:var(--card);width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.pane h2{margin:0 0 4px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.chip{min-height:60px;border-radius:12px;background:var(--neuBg);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}
.chip small{font-weight:500;color:var(--sub);font-size:11px}
.chip.srv{outline:2px solid var(--pri2)}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .l{font-size:12px;color:var(--sub);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .d{font-size:12px;color:var(--sub)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.2em;gap:8px;align-items:center;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:12px;background:var(--neuBg);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .fill.g{background:var(--gain)}.bar .fill.l{background:var(--loss)}
.bar .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar.grp{font-weight:700}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--neuBg);font-weight:600;color:var(--sub);font-size:11px;white-space:normal;min-width:4.2em}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{background:var(--neuBg)}
tr.tot td{font-weight:700;background:var(--neuBg)}
td.g{color:var(--gain);font-weight:700}td.l{color:var(--loss);font-weight:700}
/* court */
.court{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:var(--court);padding:8px;border-radius:12px}
.net{grid-column:1/-1;height:8px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 7px);opacity:.55}
.cell{background:var(--card);border-radius:9px;min-height:56px;font-size:10px;text-align:center;padding:4px 2px;display:flex;flex-direction:column;justify-content:center;color:var(--sub);line-height:1.25}
.cell b{font-size:13px;color:var(--ink)}
.cell.on{outline:2px solid var(--gain)}
.gap{visibility:hidden}
.olist{display:grid;grid-template-columns:2.2em 1fr;gap:4px 8px;align-items:center}
.olist .no{font-weight:800;text-align:center;background:var(--neuBg);border-radius:8px;padding:4px 0}
.ok{color:var(--gain);font-weight:700}.ng{color:var(--loss);font-weight:700}
.prow{display:grid;grid-template-columns:4.2em 1fr 1fr 40px;gap:6px;align-items:center;margin-bottom:6px}
.x{min-height:44px;color:var(--loss);font-weight:700}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.flow{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px 0}
.fg{display:grid;row-gap:3px;width:max-content}
.fg .lb{position:sticky;left:0;z-index:1;background:var(--card);font-size:11px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0 4px}
.fc{width:20px;height:22px;margin:0 1px;border-radius:4px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;padding:0}
.fc.g.s{background:var(--gain);color:var(--card)}.fc.g.m{background:var(--gainBg);color:var(--gain);border:1px dashed var(--gain)}
.fc.l.s{background:var(--loss);color:var(--card)}.fc.l.m{background:var(--lossBg);color:var(--loss);border:1px dashed var(--loss)}
.fsvg line.z{stroke:var(--line);stroke-width:1}.fsvg path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 0 2px;align-items:center}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
details.mf{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 12px;margin-bottom:8px}
details.mf>summary{list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:44px}
details.mf>summary::-webkit-details-marker,details.sf>summary::-webkit-details-marker{display:none}
details.mf>summary::after,details.sf>summary::after{content:'▼';font-size:10px;color:var(--sub);flex:0 0 auto}
details[open].mf>summary::after,details[open].sf>summary::after{content:'▲'}
details.sf{border-top:1px solid var(--line);padding:2px 0 8px}
details.sf>summary{list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:40px;font-size:14px}
ul.notes{margin:0;padding-left:1.2em}ul.notes li{margin:4px 0}
.otbl td:first-child button{font-weight:700;color:var(--pri);text-align:left;padding:0;min-height:0}
textarea.ai{width:100%;font:inherit;font-size:13px;line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--neuBg);color:var(--ink);height:38vh}
button.kpi.kb{text-align:left;width:100%;display:block}
button.kpi.kb .d{color:var(--pri)}
button.bar{width:100%;text-align:left;padding:2px 0}
.tourbar{margin:-4px 0 0}
.cwrap{max-width:330px;margin:0 auto;text-align:center}
.pane .cwrap{max-width:280px}
.clbl{font-size:11px;color:var(--sub);font-weight:600;margin:2px 0}
.cpick{width:100%;aspect-ratio:1;touch-action:manipulation}
.cpick[data-act]{cursor:crosshair}
.cpick.flip svg{transform:rotate(180deg)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;flex:0 0 auto}
.flrow{display:flex;justify-content:flex-end;margin:4px 0 -4px}
.netbar.fl{border-bottom:0;border-top:3px solid var(--ink);padding:2px 0 0;margin:6px 0 8px}
.optl .mcheck,.mcheck.ofl{align-items:flex-start}
.optl .mcheck input,.mcheck.ofl input{flex:0 0 22px;width:22px;height:22px;margin-top:2px}
.csvg{width:100%;height:100%;display:block}
.csvg .cbg{fill:var(--court);stroke:var(--ink);stroke-width:.8}
.csvg .cg{stroke:var(--ink);stroke-width:.3;stroke-dasharray:1.5 1.5;opacity:.35;fill:none}
.csvg .cl{stroke:var(--ink);stroke-width:.6;opacity:.7}
.csvg .cn{stroke:var(--ink);stroke-width:1.8}
.csvg .cheat{fill:var(--loss)}
.csvg .cz{font-size:7px;font-weight:800;text-anchor:end;fill:var(--ink);opacity:.6}
.csvg .cp{stroke:var(--card);stroke-width:.7}
.csvg .cmark{fill:none;stroke:var(--ink);stroke-width:1.2}
.csvg .cout{fill:var(--neuBg)}
.csvg .cpx{stroke-width:1.6;stroke-linecap:round;fill:none}
.mhead.pin{position:sticky;top:0;z-index:15;background:var(--bg);margin:0 -16px;padding:calc(env(safe-area-inset-top) + 4px) 16px 0;box-shadow:0 1px 0 var(--line)}
.mhead.pin .top{margin-bottom:4px}.mhead.pin .tabs{margin-bottom:8px}
body.pinned .board{top:var(--hh,0px);padding-top:6px}
.pinbtn{flex:0 0 auto;min-height:34px;font-size:13px;padding:0 10px}.pinbtn.on{background:var(--pri2);color:#fff}
body.capture .mhead{position:static;box-shadow:none}
details.tour>summary{min-height:56px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.gbtn{min-height:68px;border-radius:12px;font-weight:800;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;border:2px solid transparent}
.gbtn small{font-size:10px;font-weight:600;margin-top:4px;opacity:.85}
.gbtn.gA{background:var(--gainBg);color:var(--gain)}.gbtn.gB{background:var(--warnBg);color:var(--warn)}.gbtn.gC{background:var(--lossBg);color:var(--loss)}
.gbtn.gO{background:var(--neuBg);color:var(--ink);font-size:13px;white-space:nowrap;letter-spacing:-.5px}
.gbtn.gO small{white-space:normal;letter-spacing:0}
.rbar{display:flex;gap:2px;height:30px;border-radius:6px;overflow:hidden;margin:6px 0}
.rbar span{display:flex;align-items:center;justify-content:center;color:var(--card);font-size:12px;font-weight:700;min-width:3px}
.rleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-bottom:6px}
.rleg span{display:inline-flex;align-items:center;gap:4px}
.rleg i{display:inline-block;width:12px;height:12px;border-radius:3px}
td small.rp{display:block;font-size:10px;color:var(--sub);font-weight:400}
.gbtn.on{border-color:currentColor}
.netbar{font-size:11px;font-weight:700;color:var(--sub);border-bottom:3px solid var(--ink);padding:0 0 2px;margin:8px 0 6px;text-align:center}
.pgrid9{display:grid;grid-template-columns:repeat(10,1fr);gap:6px 4px}
.pgrid9 .chip{min-height:54px;font-size:14px;padding:2px 1px}
.pgrid9 .chip small{font-size:10px}
.mcheck{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
body.capture #app{width:960px;max-width:none;padding:24px}
body.capture .print-only{display:block}
body.capture .noprint,body.capture nav#nav{display:none!important}
body.capture .tbl,body.capture .flow{overflow:visible}
body.capture .board,body.capture td:first-child,body.capture th:first-child,body.capture .fg .lb{position:static}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
#toast.top{bottom:auto;top:calc(env(safe-area-inset-top) + 10px)}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav#nav button{flex:1;padding:7px 0 5px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}
nav#nav button.on{color:var(--pri2)}
nav#nav svg{width:24px;height:24px}
.print-only{display:none}
.bwrap{margin:4px 0}
.bsvg{display:block;width:min(100%,calc((100vh - 250px)*128/228));width:min(100%,calc((100dvh - 250px)*128/228));min-width:240px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bsvg .bout{fill:var(--neuBg)}.bsvg .bcourt{fill:var(--court);stroke:var(--ink);stroke-width:.8}
.bsvg .bl2{stroke:var(--ink);stroke-width:.5;opacity:.7;fill:none}.bsvg .bnet{stroke:var(--ink);stroke-width:1.6}
.bsvg .blab{font-size:4.2px;fill:var(--sub);text-anchor:middle;font-weight:700}
.bsvg .bpen{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bsvg .bhit{fill:none;stroke:transparent;stroke-width:7;pointer-events:stroke}
.bsvg.m-erase .bpen{stroke-dasharray:2 1.4}
.btok{cursor:grab}.btok circle{stroke:var(--card);stroke-width:1}
.btok .bhalo{fill:transparent;stroke:none}
.btok.own circle:not(.bhalo){fill:var(--pri2)}.btok.opp circle:not(.bhalo){fill:var(--loss)}
.btok text{fill:#fff;font-weight:800;text-anchor:middle;pointer-events:none}
.btok.ball circle:not(.bhalo){fill:#F4C430;stroke:var(--ink);stroke-width:.5}.btok .bseam{fill:none;stroke:var(--ink);stroke-width:.35}
.btok.sel circle:not(.bhalo){stroke:var(--ink);stroke-width:1.4}.btok.sel .bhalo{fill:var(--ink);opacity:.15}
.bsvg.m-pen .btok,.bsvg.m-erase .btok{pointer-events:none}
.btitle{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;margin:2px 0 6px}
.bctl{margin:0 0 6px}.btn.pen i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}.btn.pen.on{outline:2px solid var(--pri2)}
.bselp{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:6px 0}
.bnote{margin-top:8px;white-space:normal}
.chip.opp{color:var(--loss)}
.bpats{margin-bottom:8px}
.media{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.media:last-of-type{border-bottom:0}
.media .mt{flex:1;min-width:0;overflow:hidden;line-height:1.35}.media .mt a{color:var(--pri)}.media .btn.sm{flex:0 0 auto}
.yth{width:96px;height:54px;object-fit:cover;border-radius:6px;display:block;background:var(--neuBg)}.ythw{flex:0 0 96px}
.micon{flex:0 0 32px;font-size:22px;text-align:center}
.tocnt{margin-top:4px}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:50vh;overflow:auto;margin:8px 0}.imgs img{width:100%;border-radius:6px;border:1px solid var(--line)}
body.capture .bsvg{width:520px}
body.capture .printonly{display:block}
.printonly{display:none}
@media print{
 nav#nav,.noprint,#toast{display:none!important}
 body{padding:0;background:#fff;color:#000}
 #app{padding:0;max-width:none}
 .card,.kpi,.tbl{break-inside:avoid;border-color:#ccc}
 .tbl{overflow:visible}

const SCORE_K=['spike','feint','block','blockout','ace'];

const MODES=[['simple','かんたん','得点・失点の種類と選手だけ'],['std','標準','＋サーブカット(A・B・C)'],['detail','くわしく','＋決められた場所・スパイクコース・サーブコース']];
function modeOf(m){return (m&&m.mode)||'std';}
const OPTS=[['rcv','サーブカット','相手サーブのたびに、受けた選手とA・B・C・ダイレクト'],['srv','サーブコース','自チームのサーブのたびに、相手コートのどこに打ったか'],['spk','スパイクコース','スパイク・フェイントなどの決定・ミス・被ブロックのコース'],['land','決められた場所','被スパイク・被フェイント・相手サービスエースが自コートのどこに落ちたか'],['foul','反則の種類','ドリブル・タッチネットなどの種類']];
function optOn(m,k){if(m&&m.opt&&k in m.opt)return !!m.opt[k];const md=modeOf(m);if(k==='rcv')return md!=='simple'&&!(m&&m.rcvOn===false);if(k==='srv')return md==='detail'&&!(m&&m.srvOn===false);if(k==='foul')return true;return md==='detail';}
function optsOf(m){const o={};OPTS.forEach(([k])=>o[k]=optOn(m,k));return o;}
function optsHTML(m){return `<div class="optl">${OPTS.map(([k,l,d])=>`<label class="mcheck"><input type="checkbox" data-ch="optT" data-k="${k}" ${optOn(m,k)?'checked':''}><span><b>${l}</b><br><span class="sub">${d}</span></span></label>`).join('')}</div><label class="mcheck ofl"><input type="checkbox" data-ch="flipT" ${m.flip?'checked':''}><span><b>コートの向きを反転(180度)</b><br><span class="sub">コートチェンジで自分の見ている向きが変わったときに。コート図と選手の並びが上下・左右逆になります(記録される場所は同じです)</span></span></label>`;}
function courtKind(m,k){if(LAND_K.includes(k))return optOn(m,'land')?'own':null;if(SPK_K.includes(k))return optOn(m,'spk')?'opp':null;return null;}
function kindOfCourt(k){return LAND_K.includes(k)?'own':(SPK_K.includes(k)||OUT_OK.includes(k))?'opp':null;}
function zoneOpp(x,y){if(x<0||x>1||y<0||y>1)return 'アウト('+(y<0?'奥':x<0?'左':x>1?'右':'手前')+')';return (y<1/3?'奥':y<2/3?'中':'前')+'・'+(x<1/3?'左':x<2/3?'中央':'右');}
function zoneFor(k,x,y){return kindOfCourt(k)==='own'?zoneOf(x,y):zoneOpp(x,y);}
const POS_X=[0.1,0.3,0.5,0.7,0.9,0.5,0.17,0.5,0.83];
function dirOf(r){if(r.lx==null)return '';const pi=(r.posB||[]).indexOf(r.who);if(pi<0||r.m.rule==='six')return zoneOpp(r.lx,r.ly);const ox=POS_X[pi],x=r.lx;if(r.lx<0||r.lx>1||r.ly<0||r.ly>1)return zoneOpp(r.lx,r.ly);
 if(ox<=0.35)return x<0.4?'ストレート':x>0.6?'クロス':'センター';if(ox>=0.65)return x>0.6?'ストレート':x<0.4?'クロス':'センター';return x<1/3?'左へ':x>2/3?'右へ':'正面';}
const LAND_STYLE={spiked:{c:'var(--loss)',sh:'c',lab:'被スパイク決定'},feinted:{c:'var(--warn)',sh:'t',lab:'被フェイント決定'},o_ace:{c:'var(--pri2)',sh:'s',lab:'相手サービスエース'}};
function zoneOf(x,y){return (y<1/3?'前':y<2/3?'中':'後')+'・'+(x<1/3?'左':x<2/3?'中央':'右');}
const FOULS=['ドリブル','オーバータイムス','オーバーネット','タッチネット','ホールディング'];

const GRADE={A:'セッターほぼ動かず・全攻撃OK',B:'セッター1〜2歩・速攻/サイド可',C:'セッター大きく移動・オープン/2段',O:'相手コートへ直接返った'};
const GR=['A','B','C','O'];const GLAB={A:'A',B:'B',C:'C',O:'ダイレクト'};
const GRADE_FULL={A:'Aカット: セッターが定位置(ほぼ動かず)からトスを上げられる最高の返球。クイック・平行・バックアタックなど、すべての攻撃を選べる',B:'Bカット: セッターが1〜2歩動かされるが、十分にコントロールできる返球。クイック(Bクイック等)やサイドへのトスが使え、合格点の攻撃ができる',C:'Cカット: セッターが大きく移動したり、ネットから大きく離れたりする難しい返球。コンビネーションが使えず、オープン攻撃(高いトス)や2段トス中心になる',O:'ダイレクト返球: カットが直接相手コートに返ってしまった返球。自チームは攻撃できない(相手のチャンスボールになる)'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pct=(a,b)=>b?(Math.round(a/b*1000)/10).toFixed(1)+'%':'-';

/* ---------- storage ---------- */
function blankDB(){return {v:2,teams:[],matches:[]}}
function newTeam(name){return {id:uid(),name:name||'チーム'+(DB&&DB.teams?DB.teams.length+1:1),players:[]}}
function migrate(d){
 if(!Array.isArray(d.teams)){d.teams=[];if((d.players&&d.players.length)||d.team)d.teams.push({id:uid(),name:d.team||'チーム1',players:d.players||[]});}
 delete d.players;delete d.team;
 if(!d.teams.length)d.teams.push({id:uid(),name:'チーム1',players:[]});
 d.matches.forEach(m=>{if(!m.teamId||!d.teams.some(t=>t.id===m.teamId))m.teamId=d.teams[0].id;});
 if(!Array.isArray(d.tours))d.tours=[];
 if(!d.oppInfo||typeof d.oppInfo!=='object'||Array.isArray(d.oppInfo))d.oppInfo={};
 d.matches.forEach(m=>{if(m.tourId&&!d.tours.some(t=>t.id===m.tourId))delete m.tourId;});
 if(!Array.isArray(d.boards))d.boards=[];d.boards.forEach(b=>{if(!d.teams.some(t=>t.id===b.teamId))b.teamId=d.teams[0].id;if(!Array.isArray(b.pats))b.pats=[];});
 d.v=2;return d;
}
function load(){try{const s=localStorage.getItem(STORE);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.matches))return migrate(d);}}catch(e){}return migrate(blankDB());}
let DB=load();
let saveFail=false;
const UIKEY='volleyRec.ui';
const teamOf=id=>DB.teams.find(t=>t.id===id)||DB.teams[0];
const teamName=id=>(DB.teams.find(t=>t.id===id)||{}).name||'';
const tourOf=id=>(DB.tours||[]).find(t=>t.id===id);
const tourName=id=>(tourOf(id)||{}).name||'';
const tourMatches=id=>DB.matches.filter(x=>x.tourId===id).sort((a,b)=>(a.created||0)-(b.created||0));
function pchgDesc(r){if(!r.pto||!r.pfrom)return '';return r.pto.map((id,i)=>id&&r.pfrom.indexOf(id)!==i?nm(r.m,id)+'→'+posShort(r.m)[i]:'').filter(Boolean).join('・');}
function evLabel(r,nine){if(r.k==='pchg'){const d=pchgDesc(r);return 'ポジション変更'+(d?'('+d+')':'');}return plabel(r.k,nine)+(r.k==='rcv'?' '+(GLAB[r.g]||r.g||'?'):'')+(r.ft?'('+r.ft+')':'')+(r.net?' [ネット]':r.oob?' [アウト]':r.lx!=null&&kindOfCourt(r.k)?' ['+zoneFor(r.k,r.lx,r.ly)+']':'');}
function evWho(m,r){if(r.k==='sub')return nm(m,r.out)+' → '+nm(m,r.inn)+(r.bad?' ⚠':'');if(r.ps&&r.ps.length)return r.ps.map(id=>nm(m,id)).join('・');return nm(m,r.who);}
function mTitle(m){if(m.title)return m.title;if(m.tourId&&tourOf(m.tourId)){const i=tourMatches(m.tourId).indexOf(m);return `${tourName(m.tourId)} 第${i+1}試合`;}return '(名称なし)';}
function oppPlayers(name){return ((DB.oppInfo||{})[name]||{}).players||[];}
function oppPlLabel(name,id){const p=oppPlayers(name).find(x=>x.id===id);return p?('#'+(p.num===''||p.num==null?'?':p.num)+(p.pos?' '+p.pos:'')):(id?'(相手選手)':'');}
function periodRange(v){const d=new Date(),ym=(y,m)=>`${y}-${String(m).padStart(2,'0')}-01`;
 if(v==='m1')return [ym(d.getFullYear(),d.getMonth()+1),''];
 if(v==='m3'){const x=new Date(d.getFullYear(),d.getMonth()-2,1);return [ym(x.getFullYear(),x.getMonth()+1),''];}
 if(v==='y')return [`${d.getFullYear()}-01-01`,''];
 if(v==='py')return [`${d.getFullYear()-1}-01-01`,`${d.getFullYear()-1}-12-31`];
 return ['',''];}
function matchFilter(m,f){
 if(f.team&&f.team!=='all'&&m.teamId!==f.team)return false;
 if(f.rule!=='all'&&m.rule!==f.rule)return false;
 if(f.kind!=='all'&&m.kind!==f.kind)return false;
 if(f.from&&(m.date||'')<f.from)return false;
 if(f.to&&(m.date||'')>f.to)return false;
 if(f.tour&&f.tour!=='all'&&m.tourId!==f.tour)return false;
 return true;}
function saveUI(){if(UI&&UI.shared)return;try{localStorage.setItem(UIKEY,JSON.stringify({hf:UI.hf,agg:UI.agg,tid:UI.tid,pin:UI.pin}))}catch(e){}}
function save(){if(UI&&UI.shared)return;try{localStorage.setItem(STORE,JSON.stringify(DB));saveFail=false;}catch(e){if(!saveFail)toast('保存できませんでした。データの保存先を確認してください');saveFail=true;}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- match helpers ---------- */
const nmCache=new WeakMap();
function nm(m,id){if(!id)return '';let c=nmCache.get(m);if(!c||c._n!==m.members.length){c=new Map();c._n=m.members.length;m.members.forEach(p=>c.set(p.id,p.name));nmCache.set(m,c);}return c.get(id)||'(不明)';}
function mem(m,id){return m.members.find(p=>p.id===id)}
function numOf(m,id){const p=mem(m,id);return p&&p.num!==''&&p.num!=null?'#'+p.num:''}
function setOpp(m,i){const s=m.sets[i];return (s&&s.opp)||m.opp||''}
function deuceOf(m,i){return m.kind==='official'?true:!!(m.sets[i]&&m.sets[i].deuce)}
function blankSet(m,i,prev){const n=N(m);const s={target:m.kind==='official'?(i===2?15:21):21,first:i%2?'相':'自',deuce:m.kind==='official',opp:'',order:Array(n).fill(''),pos:Array(isNine(m)?9:6).fill('')};if(isNine(m)&&i>0)s.start='cont';if(prev){s.target=prev.target;s.deuce=prev.deuce;s.opp=prev.opp;s.order=prev.order.slice();s.pos=(prev.pos||[]).slice();s.first=prev.first==='自'?'相':'自';}return s;}
function startSlot(m,i,prev){const s=m.sets[i]||{},n=N(m),v=s.start;if(v==='cont'){if(prev&&prev.lr)return prev.lr.side==='自'?prev.lr.slot%n+1:prev.slot;return 1;}return +v>=1&&+v<=n?+v:1;}
function initSet(m,i,prev){const s=m.sets[i]||{};return {si:i,set:i+1,side:s.first==='相'?'相':'自',slot:startSlot(m,i,prev),us:0,them:0,order:(s.order||[]).slice(),pos:(s.pos||[]).slice(),ended:false,rcv:null,sc:null,scRow:null,s1:false}}
function needWins(m){return Math.ceil(m.sets.length/2)}

function replay(m){
 const n=N(m),rows=[],sums=[],ends={};let st=initSet(m,0),w=0,l=0,over=false,orphan=0;
 const closeSet=()=>{ends[st.si]={lastSide:st.lr?st.lr.side:'',next:st.lr?(st.lr.side==='自'?st.lr.slot%n+1:st.slot):1};const r=st.us>st.them?'○':st.us<st.them?'×':'△';sums.push({si:st.si,set:st.set,opp:setOpp(m,st.si),us:st.us,them:st.them,done:true,res:r});if(r==='○')w++;else if(r==='×')l++;if(m.kind==='official'&&(w>=needWins(m)||l>=needWins(m)))over=true;};
 for(let i=0;i<m.events.length;i++){
  const ev=m.events[i];
  if(st.ended){if(over||st.si+1>=m.sets.length){orphan++;continue;}st=initSet(m,st.si+1,st);}
  const p=P[ev.k];if(!p)continue;
  const server=st.side==='自'?(st.order[st.slot-1]||''):'';
  let who=ev.p||'';
  if(!who&&(p.need==='auto'||p.need==='srvc')&&st.side==='自')who=server;
  const row={i,m,ord:st.order.slice(),posB:st.pos.slice(),k:ev.k,res:p.res,cls:p.cls,set:st.set,si:st.si,opp:setOpp(m,st.si),side:st.side,slot:st.slot,server,who,inn:ev.in||'',memo:ev.memo||'',op:ev.op||'',g:ev.g||'',ft:ev.ft||'',ps:Array.isArray(ev.ps)?ev.ps.slice():[],lx:typeof ev.lx==='number'?ev.lx:null,ly:typeof ev.ly==='number'?ev.ly:null,net:!!ev.net,oob:!!ev.oob,rg:ev.k==='rcv'?(ev.g||'?'):st.rcv};
  if(ev.k==='rcv')st.rcv=ev.g||'?';
  if(ev.k==='srvc'){st.sc=1;st.scRow=row;}
  if(ev.k==='serve1'&&st.side==='自')st.s1=true;
  if((p.res==='得'||p.res==='失')&&st.scRow){st.scRow.out=p.res;st.scRow.endK=ev.k;}
  if(ev.k==='pchg'){row.who='';if(Array.isArray(ev.pos)&&ev.pos.length===st.pos.length){row.pfrom=st.pos.slice();row.pto=ev.pos.slice();st.pos=ev.pos.slice();}else row.bad=true;}
  if(ev.k==='sub'){row.who='';row.out=ev.p||'';const a=st.order.indexOf(ev.p);if(a>=0&&ev.in&&st.order.indexOf(ev.in)<0){st.order[a]=ev.in;const b=st.pos.indexOf(ev.p);if(b>=0)st.pos[b]=ev.in;}else row.bad=true;}
  if(p.res==='得'||p.res==='失')st.lr={side:st.side,slot:st.slot};
  if(p.res==='得')st.us++;else if(p.res==='失')st.them++;
  if(p.res==='失'&&st.side==='自')st.slot=st.slot%n+1;
  if(p.res==='得')st.side='自';else if(p.res==='失')st.side='相';
  if(p.res==='得'||p.res==='失'){st.rcv=null;st.sc=null;st.scRow=null;st.s1=false;}
  row.us=st.us;row.them=st.them;
  const tg=+(m.sets[st.si]&&m.sets[st.si].target)||21;
  if(ev.k==='set_end'||(Math.max(st.us,st.them)>=tg&&(!deuceOf(m,st.si)||Math.abs(st.us-st.them)>=2))){st.ended=true;row.setEnd=true;closeSet();}
  rows.push(row);
 }
 if(!st.ended&&rows.some(r=>r.si===st.si))sums.push({si:st.si,set:st.set,opp:setOpp(m,st.si),us:st.us,them:st.them,done:false,res:'途中'});
 let cur=st,needSet=false;
 if(st.ended&&!over){if(st.si+1<m.sets.length)cur=initSet(m,st.si+1,st);else needSet=true;}
 cur.server=cur.side==='自'?(cur.order[cur.slot-1]||''):'';
 cur.next=cur.side==='自'?(cur.order[cur.slot%n]||''):(cur.order[cur.slot-1]||'');
 return {rows,sums,cur,over,needSet,w,l,orphan,ends,lastRow:rows[rows.length-1]};
}
function resultLabel(m,R){
 if(!m.events.length)return '未記録';
 if(m.kind==='official')return R.over?`${R.w}-${R.l} ${R.w>R.l?'勝ち':'負け'}`:`${R.w}-${R.l} 試合中`;
 const dr=R.sums.filter(s=>s.res==='△').length;return `${R.w}勝${R.l}敗${dr?dr+'分':''}`;
}
function orderReady(m,si){const s=m.sets[si];if(!s)return false;const n=N(m);const o=s.order.filter(Boolean);if(o.length!==n||new Set(o).size!==n)return false;return true;}
function posCheck(m,si){const s=m.sets[si];const a=(s.pos||[]).filter(Boolean),b=s.order.filter(Boolean),n=isNine(m)?9:6;if(!isNine(m)&&!a.length)return true;if(a.length!==n||new Set(a).size!==n)return false;return a.every(x=>b.includes(x));}
function oppsOf(m){const o=new Set();m.sets.forEach((s,i)=>{const x=setOpp(m,i);if(x)o.add(x)});if(!o.size&&m.opp)o.add(m.opp);return [...o];}
function knownOpps(lim){const c={};DB.matches.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(m=>{if(m.opp&&!c[m.opp])c[m.opp]=1;m.sets.forEach(s=>{if(s.opp&&!c[s.opp])c[s.opp]=1;});});Object.keys(DB.oppInfo||{}).forEach(k=>{if(!c[k])c[k]=1;});return Object.keys(c).slice(0,lim||15);}

/* ---------- stats ---------- */
function calc(rows){
 const S={us:0,them:0,so:0,soT:0,br:0,brT:0,k:{},cls:{},pl:{},slot:{},s1self:0,s1opp:0,rc:{A:0,B:0,C:0,O:0,X:0},rgSo:{A:{w:0,t:0},B:{w:0,t:0},C:{w:0,t:0},O:{w:0,t:0}},hasRcv:false,op:{},ft:{}};
 const pl=name=>S.pl[name]||(S.pl[name]={name,k:{},srvT:0,srvW:0,rc:{A:0,B:0,C:0,O:0,X:0}});
 for(const r of rows){
  S.k[r.k]=(S.k[r.k]||0)+1;
  if(r.k==='serve1'){if(r.side==='自')S.s1self++;else S.s1opp++;}
  if(r.k==='rcv'){S.hasRcv=true;if(GRADE[r.g]){S.rc[r.g]++;if(r.who)pl(nm(r.m,r.who)).rc[r.g]++;}}
  if(r.k==='o_ace'||r.k==='r_serve'){S.rc.X++;if(r.who)pl(nm(r.m,r.who)).rc.X++;}
  if((r.res==='得'||r.res==='失')&&r.side==='相'&&GRADE[r.rg]){const x=S.rgSo[r.rg];x.t++;if(r.res==='得')x.w++;}
  if(r.op){const key=r.opp+'|'+r.op;const o=S.op[key]||(S.op[key]={opp:r.opp,id:r.op,got:0,miss:0,k:{}});o.k[r.k]=(o.k[r.k]||0)+1;if(r.res==='失')o.got++;else if(r.res==='得')o.miss++;}
  if(r.res==='得'||r.res==='失'){
   if(r.res==='得')S.us++;else S.them++;
   S.cls[r.cls]=(S.cls[r.cls]||0)+1;
   const sl=S.slot[r.slot]||(S.slot[r.slot]={so:0,soT:0,br:0,brT:0});
   if(r.side==='相'){S.soT++;sl.soT++;if(r.res==='得'){S.so++;sl.so++;}}else{S.brT++;sl.brT++;if(r.res==='得'){S.br++;sl.br++;}}
   if(r.server){const x=pl(nm(r.m,r.server));x.srvT++;if(r.res==='得')x.srvW++;}
  }
  if(r.who&&r.k!=='sub'){const x=pl(nm(r.m,r.who));x.k[r.k]=(x.k[r.k]||0)+1;}
  if(r.ps&&r.ps.length)r.ps.forEach(id=>{const x=pl(nm(r.m,id));x.k[r.k]=(x.k[r.k]||0)+1;});
  if(r.k==='foul'||r.k==='o_foul'){const f=S.ft[r.k]||(S.ft[r.k]={});const t=r.ft||'選択なし';f[t]=(f[t]||0)+1;}
 }
 Object.values(S.pl).forEach(x=>{x.score=SCORE_K.reduce((a,k)=>a+(x.k[k]||0),0);x.miss=MISS_K.reduce((a,k)=>a+(x.k[k]||0),0);});
 return S;
}
function flowSet(m,rows){
 const pts=rows.filter(r=>r.res==='得'||r.res==='失');
 if(!pts.length)return '<p class="sub">点の記録がありません</p>';
 const n=pts.length,W=22,H=54;
 let run=0,side='',mu=0,mt=0,lead=0,beh=0;
 pts.forEach(r=>{if(r.res===side)run++;else{side=r.res;run=1;}if(side==='得')mu=Math.max(mu,run);else mt=Math.max(mt,run);const d=r.us-r.them;lead=Math.max(lead,d);beh=Math.min(beh,d);});
 const amp=Math.max(3,lead,-beh),y=d=>(H/2-d/amp*(H/2-5)).toFixed(1);
 const path='M0 '+y(0)+' '+pts.map((r,j)=>`L${j*W+W/2} ${y(r.us-r.them)}`).join(' ');
 const nine=isNine(m);
 const tip=r=>esc(`${r.us}-${r.them} ${plabel(r.k,nine)}${r.who?' '+nm(m,r.who):''}`);
 let g=`<div class="fg" style="grid-template-columns:34px repeat(${n},${W}px)">`;
 g+=`<div class="lb" title="点差(上=リード)">点差</div><svg class="fsvg" width="${n*W}" height="${H}" style="grid-column:span ${n}" viewBox="0 0 ${n*W} ${H}" role="img" aria-label="点差の推移 最大リード${lead} 最大ビハインド${-beh}"><line class="z" x1="0" x2="${n*W}" y1="${y(0)}" y2="${y(0)}"/><path d="${path}"/></svg>`;
 g+='<div class="lb">自</div>'+pts.map(r=>r.res==='得'?`<button class="fc g ${r.cls==='決定'?'s':'m'}" data-act="tip" data-t="${tip(r)}">${r.us}</button>`:'<span></span>').join('');
 g+='<div class="lb">相</div>'+pts.map(r=>r.res==='失'?`<button class="fc l ${r.cls==='被決定'?'s':'m'}" data-act="tip" data-t="${tip(r)}">${r.them}</button>`:'<span></span>').join('');
 g+='</div>';
 return `<p class="sub" style="margin:4px 0">連続得点 最大<b>${mu}</b>・連続失点 最大<b>${mt}</b>・最大リード <b>${lead}</b>・最大ビハインド <b>${-beh}</b></p><div class="flow">${g}</div>`;
}
const FLOW_LEGEND='<div class="legend"><span><i style="background:var(--gain)"></i>自チームで決めた</span><span><i style="background:var(--gainBg);border:1px dashed var(--gain)"></i>相手のミス</span><span><i style="background:var(--loss)"></i>相手に決められた</span><span><i style="background:var(--lossBg);border:1px dashed var(--loss)"></i>自チームのミス</span></div><p class="sub" style="margin:0 0 6px">数字をタップすると、その点の内容が出ます。線は点差(上がリード)。</p>';
function flowMatch(m,rows,openAll){
 const R=replay(m);const sis=[...new Set(rows.map(r=>r.si))];
 return sis.map(si=>{const s=R.sums.find(x=>x.si===si)||{us:0,them:0,res:''};const op=setOpp(m,si);
  return `<details class="sf"${openAll?' open':''}><summary><span>第${si+1}セット${op&&m.kind==='practice'?' vs '+esc(op):''}</span><span><b>${s.us}-${s.them}</b> <span class="${s.res==='○'?'ok':s.res==='×'?'ng':''}">${s.res}</span></span></summary>${flowSet(m,rows.filter(r=>r.si===si))}</details>`;}).join('');
}
function runsOf(rows){
 let best={n:0},cur=null;
 rows.forEach(r=>{if(r.res!=='得'&&r.res!=='失')return;const key=r.m.id+'_'+r.si;
  if(!cur||cur.key!==key||cur.res!==r.res)cur={key,res:r.res,n:0,r};cur.n++;
  if(r.res==='失'&&cur.n>best.n)best={n:cur.n,r:cur.r,end:r};});
 return best;
}
function setTrend(rows,sums){
 const ks=[...new Set(rows.map(r=>r.set))].sort((a,b)=>a-b);
 return ks.map(k=>{const rr=rows.filter(r=>r.set===k),ss=(sums||[]).filter(x=>x.set===k&&x.done);const S=calc(rr);const c=Math.max(1,new Set(rr.map(r=>r.m.id+'_'+r.si)).size);
  return {k,S,sets:ss.length,w:ss.filter(x=>x.res==='○').length,l:ss.filter(x=>x.res==='×').length,avgUs:S.us/c,avgThem:S.them/c,so:S.soT?S.so/S.soT:null,br:S.brT?S.br/S.brT:null,own:(S.cls['自ミス']||0)/c,got:(S.cls['被決定']||0)/c};});
}
function setTrendTable(T){
 const f1=x=>x.toFixed(1);
 let h='<div class="tbl"><table><tr><th>セット</th><th>セット数</th><th>勝-敗</th><th>平均スコア</th><th>サイドアウト率</th><th>ブレイク率</th><th>自ミス/セット</th><th>決められた/セット</th></tr>';
 T.forEach(t=>{h+=`<tr><td><b>${t.k}セット目</b></td><td>${t.sets}</td><td>${t.w}-${t.l}</td><td><b>${f1(t.avgUs)}-${f1(t.avgThem)}</b></td><td>${t.so===null?'-':pct(t.S.so,t.S.soT)}</td><td>${t.br===null?'-':pct(t.S.br,t.S.brT)}</td><td>${f1(t.own)}</td><td>${f1(t.got)}</td></tr>`;});
 return h+'</table></div><p class="sub">「平均スコア」「自ミス/セット」などは1セットあたりの平均です。途中で終わったセットは、平均には入りますが、勝敗とセット数には入りません。</p>';
}
function oppTable(rows,sums){
 const g={};
 rows.forEach(r=>{const o=r.opp||'(相手未入力)';(g[o]||(g[o]={o,rows:[],ms:new Set(),last:''})).rows.push(r);g[o].ms.add(r.m.id);if((r.m.date||'')>g[o].last)g[o].last=r.m.date||'';});
 const list=Object.values(g).map(x=>{const ss=(sums||[]).filter(s=>(s.opp||'(相手未入力)')===x.o&&s.done);const S=calc(x.rows);const w=ss.filter(s=>s.res==='○').length,l=ss.filter(s=>s.res==='×').length;return Object.assign(x,{S,w,l,n:ss.length});}).sort((a,b)=>b.last.localeCompare(a.last)||b.n-a.n);
 if(!list.length)return '';
 let h='<div class="tbl otbl"><table><tr><th>相手</th><th>最終対戦</th><th>試合</th><th>セット勝-敗</th><th>勝率</th><th>得点-失点</th><th>サイドアウト率</th><th>ブレイク率</th></tr>';
 list.forEach(x=>{const d=x.S.us-x.S.them;h+=`<tr><td><button data-act="aggOpp" data-v="${esc(x.o)}">${esc(x.o)} ›</button></td><td>${esc(fmtD(x.last))}</td><td>${x.ms.size}</td><td class="${x.w>x.l?'g':x.w<x.l?'l':''}">${x.w}-${x.l}</td><td>${x.n?Math.round(x.w/x.n*100)+'%':'-'}</td><td>${x.S.us}-${x.S.them} <span class="sub">(${d>0?'+':''}${d})</span></td><td>${pct(x.S.so,x.S.soT)}</td><td>${pct(x.S.br,x.S.brT)}</td></tr>`;});
 return h+'</table></div><p class="sub">相手の名前をタップすると、その相手だけの集計になります。</p>';
}
function insights(rows,sums,o){
 const S=calc(rows),L=[];if(!S.us&&!S.them)return L;
 const P_=(a,b)=>b?Math.round(a/b*100):0;
 const done=(sums||[]).filter(s=>s.done),sw=done.filter(s=>s.res==='○').length,sl=done.filter(s=>s.res==='×').length,d=S.us-S.them;
 L.push(`${done.length?`セットは<b>${sw}勝${sl}敗</b>。`:''}得点${S.us}・失点${S.them}(${d>=0?'+':''}${d})。`);
 if(S.soT>=5){const v=S.so/S.soT;L.push(v<0.5?`サイドアウト率は<b>${pct(S.so,S.soT)}</b>と5割を下回り、相手サーブから1本で切れない場面が多めでした。サーブカットからの攻撃が課題です。`:`サイドアウト率は<b>${pct(S.so,S.soT)}</b>で、相手サーブはおおむね1本で切れています。`);}
 if(S.brT>=5){const v=S.br/S.brT;L.push(v>=0.5?`自チームのサーブ中も<b>${pct(S.br,S.brT)}</b>で点を取れていて、連続得点できています。`:`自チームのサーブ中の得点率(ブレイク率)は<b>${pct(S.br,S.brT)}</b>。サーブで崩して連続得点する場面を増やしたいところです。`);}
 if(S.us){const dec=S.cls['決定']||0;L.push(`得点のうち<b>${P_(dec,S.us)}%</b>(${dec}点)は自分たちで決めた点、${S.cls['相手ミス']||0}点は相手のミスでした。`);}
 if(S.them){const own=S.cls['自ミス']||0;const top=LOSS.filter(k=>P[k].cls==='自ミス').map(k=>[k,S.k[k]||0]).sort((a,b)=>b[1]-a[1])[0];
  L.push(`失点の<b>${P_(own,S.them)}%</b>(${own}点)が自分たちのミスで${top&&top[1]?`、いちばん多いのは「${esc(plabel(top[0],o.nine))}」(${top[1]}点)`:''}でした。`);}
 L.push(`サーブはエース${S.k.ace||0}本、${o.nine?'2本目ミス':'サーブミス'}${S.k.serve_miss||0}本${o.nine?`(1本目ミス${S.s1self}本)`:''}。`);
 const top=Object.values(S.pl).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
 if(top.length)L.push(`得点が多かったのは ${top.map(x=>esc(x.name)+'('+x.score+')').join('、')}。`);
 if(S.hasRcv){const T=S.rc,n=T.A+T.B+T.C+T.O+T.X;if(n>=5){L.push(`サーブカットはA返球率<b>${pct(T.A,n)}</b>、A+B(速攻・サイドが使えた)は${pct(T.A+T.B,n)}(${n}本)。`);const a=S.rgSo.A,c=S.rgSo.C;if(a.t>=3&&c.t>=3)L.push(`カットがAのときのサイドアウト率は<b>${pct(a.w,a.t)}</b>、Cのときは${pct(c.w,c.t)}。`);}}
 {const lp=rows.filter(r=>LAND_K.includes(r.k)&&r.lx!=null);if(lp.length>=5){const zs={};lp.forEach(r=>{const z=zoneOf(r.lx,r.ly);zs[z]=(zs[z]||0)+1;});const t=Object.entries(zs).sort((a,b)=>b[1]-a[1])[0];L.push(`決められたボールがいちばん多く落ちたのは<b>${t[0]}</b>(${lp.length}点中${t[1]}点)。`);}}
 {const sp=rows.filter(r=>SPK_K.includes(r.k)&&r.lx!=null);if(sp.length>=5){const g={};sp.forEach(r=>{const d=dirOf(r);const x=g[d]||(g[d]={k:0,n:0});x.n++;if(spkRes(r.k)==='kill')x.k++;});const t=Object.entries(g).filter(([d,x])=>x.n>=3).sort((a,b)=>b[1].k/b[1].n-a[1].k/a[1].n)[0];if(t)L.push(`スパイクは<b>${t[0]}</b>がいちばん決まっています(${t[1].n}本中${t[1].k}本)。`);}}
 {const sc=rows.filter(r=>r.k==='srvc'&&r.lx!=null&&r.out);if(sc.length>=6){const g={};sc.forEach(r=>{const z=zoneOpp(r.lx,r.ly);const x=g[z]||(g[z]={w:0,n:0});x.n++;if(r.out==='得')x.w++;});const t=Object.entries(g).filter(([z,x])=>x.n>=3).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n)[0];if(t)L.push(`サーブは<b>${t[0]}</b>を狙ったときのブレイク率が${pct(t[1].w,t[1].n)}(${t[1].n}本)でいちばん高いです。`);}}
 const rn=runsOf(rows);if(rn.n>=3)L.push(`いちばん長い連続失点は<b>${rn.n}点</b>(${o.multi?esc(fmtD(rn.r.m.date))+' ':''}第${rn.r.set}セット ${rn.r.us}-${rn.r.them - 1}から)。流れを止める声かけやタイムのタイミングを確認しておきましょう。`);
 const sl_=Object.entries(S.slot).filter(([k,v])=>v.soT>=5).map(([k,v])=>[+k,v.so/v.soT,v]);

 if(o.trend&&o.trend.length>=2){const t=o.trend.filter(x=>x.so!==null&&x.S.soT>=5);if(t.length>=2){const lo=t.slice().sort((a,b)=>a.so-b.so)[0],hi=t.slice().sort((a,b)=>b.so-a.so)[0];if(hi.so-lo.so>=0.1)L.push(`セット別では、<b>${lo.k}セット目</b>のサイドアウト率(${pct(lo.S.so,lo.S.soT)})が${hi.k}セット目(${pct(hi.S.so,hi.S.soT)})より低めです。`);}
  const t2=o.trend.filter(x=>x.sets>=2);if(t2.length>=2){const wo=t2.slice().sort((a,b)=>b.own-a.own)[0];L.push(`自分たちのミスが多いのは<b>${wo.k}セット目</b>(1セット平均${wo.own.toFixed(1)}点)。`);}}
 return L;
}
function notesHTML(L){return L.length?`<h2>まとめ(自動)</h2><div class="card"><ul class="notes">${L.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn pri block noprint" style="margin-top:10px" data-act="ai">✨ AIで詳しく総括する</button></div>`:''}

 const pl=Object.values(S.pl).sort((a,b)=>b.score-a.score);
 if(pl.length){T.push('【選手別】(得点/ミス計/サーブ本数とサーブ中得点率)');pl.forEach(x=>{const ms=MISS_K.filter(k=>x.k[k]).map(k=>`${plabel(k,nine)}${x.k[k]}`).join('・');T.push(`${x.name}: 得点${x.score}(${SCORE_K.filter(k=>x.k[k]).map(k=>`${plabel(k,nine)}${x.k[k]}`).join('・')||'なし'}) / ミス${x.miss}${ms?'('+ms+')':''} / サーブ${x.srvT}本 ${pct(x.srvW,x.srvT)}`);});}

function aggRows(){
 const f=UI.agg;let rows=[],sums=[],baseRows=[],baseSums=[],mc=0;const opps=new Set(),setNos=new Set(),ids=new Set();
 DB.matches.forEach(m=>{
  if(!matchFilter(m,f))return;
  const R=replay(m);R.rows.forEach(r=>{if(r.opp)opps.add(r.opp);setNos.add(r.set)});
  let rr=R.rows,ss=R.sums.map(s=>Object.assign({date:m.date,m},s));
  if(f.set&&f.set!=='all'){rr=rr.filter(r=>r.set===+f.set);ss=ss.filter(s=>s.set===+f.set);}
  baseRows=baseRows.concat(rr);baseSums=baseSums.concat(ss);
  if(f.opp){rr=rr.filter(r=>r.opp===f.opp);ss=ss.filter(s=>s.opp===f.opp);}

 });

function ctxFor(m,R,s){const idx=s.mode==='ins'?s.at:(s.mode==='edit'||s.mode==='editP')?s.i:null;

 return {order:R.cur.order,pos:R.cur.pos,server:R.cur.server,si:R.cur.si};}
function applyEv(s,k,p,inn,x){
 {const m_=curM();if(m_&&courtKind(m_,k)&&(!s.mode||s.mode==='ins'||s.mode==='edit')&&!(x&&'lx' in x)&&!s.noLand){openSheet({type:'land',k,base:{s:Object.assign({},s),p,inn,x:Object.assign({},x||{})}});return;}}
 if(!s.mode){commit(k,p,inn,x);return;}
 const m=curM();let msg;
 if(s.mode==='edit'){const old=m.events[s.i];const ne={k,p:p||null,in:inn||null,t:old.t||Date.now()};if(old.memo)ne.memo=old.memo;m.events[s.i]=Object.assign(ne,x||{});msg='変更しました';}
 else if(s.mode==='editP'){const ev=m.events[s.i];ev.p=p||null;if(ev.k==='sub')ev.in=inn||null;delete ev.op;delete ev.ft;delete ev.ps;if(x)Object.assign(ev,x);msg='変更しました';}
 else{m.events.splice(s.at,0,Object.assign({k,p:p||null,in:inn||null,t:Date.now()},x||{}));msg='追加しました';}
 touch(m);UI.sheet=null;render();toast(msg);
}

 {const lm=DB.matches.filter(x=>x.teamId===T.id).sort((a,b)=>b.created-a.created)[0];m.mode=lm?modeOf(lm):'std';m.opt=optsOf(lm||{});}

const BACT={
 bImg:()=>{const bp=curBP();if(bp.pats.length<=1)BACT.bImgGo({dataset:{v:'one'}});else openSheet({type:'bimg'});},
 bImgGo:async e=>{const bp=curBP(),pt=curPat(bp),v=e.dataset.v;UI.sheet=null;renderSheet();toast('画像を作っています…');
  try{const toBlob=cv=>new Promise(r=>cv.toBlob(r,'image/png'));const nm=s=>`ボード_${fileSafe(bp.name)}_${fileSafe(s)}.png`;
   if(v==='each'){const items=[];for(const p of bp.pats){const b=await toBlob(await boardCanvas(bp,[p],1));items.push({blob:b,url:URL.createObjectURL(b),name:nm(p.name)});}openSheet({type:'imgs',items});}
   else{const ps=v==='one'?[pt]:bp.pats;const cv=await boardCanvas(bp,ps,v==='one'?1:Math.min(2,ps.length));const b=await toBlob(cv);openSheet({type:'img',url:URL.createObjectURL(b),blob:b,name:nm(v==='one'?pt.name:`全${ps.length}パターン`)});}}
  catch(err){toast('画像を作れませんでした');}},
 imgsSend:()=>{const s=UI.sheet;shareFiles(s.items.map(x=>new File([x.blob],x.name,{type:'image/png'})));},
 bpNew:()=>openSheet({type:'bpNew',rule:'nine',team:(DB.teams.find(t=>t.id===UI.tid)||DB.teams[0]).id}),
 bpRule:e=>{const s=UI.sheet;s.name=$('#bpName').value;s.rule=e.dataset.v;renderSheet();},
 bpCreate:()=>{const s=UI.sheet,name=($('#bpName').value||'').trim()||'プロジェクト'+(boards().length+1);const team=$('#bpTeam')?$('#bpTeam').value:s.team;
  const bp={id:uid(),name,teamId:team,rule:s.rule||'nine',pats:[],created:Date.now(),updated:Date.now()};bp.pats.push(basePat(bp));boards().push(bp);
  UI.bp=bp.id;UI.bpat=bp.pats[0].id;UI.bsel='';UI.bpres=false;UI.sheet=null;save();render();toast('作成しました。「＋ 追加」で場面ごとのパターンを足せます');},
 bpOpen:e=>{UI.bp=e.dataset.id;UI.bpat='';UI.bsel='';UI.bpres=false;window.scrollTo(0,0);render();},
 bpBack:()=>{UI.bp='';UI.bsel='';UI.bpres=false;render();},
 bpEdit:()=>openSheet({type:'bpEdit'}),
 bpSave:()=>{const bp=curBP();bp.name=($('#bpName').value||'').trim()||bp.name;if($('#bpTeam'))bp.teamId=$('#bpTeam').value;UI.sheet=null;touchB();render();},
 bpDel:()=>{const bp=curBP();if(!confirm(`プロジェクト「${bp.name}」と${bp.pats.length}個のパターンを削除しますか?`))return;DB.boards=boards().filter(b=>b!==bp);UI.bp='';UI.sheet=null;save();render();toast('削除しました');},
 patSel:e=>{UI.bpat=e.dataset.id;UI.bsel='';render();},
 patNew:()=>openSheet({type:'patNew'}),
 patFrom:e=>{UI.sheet.from=e.dataset.v;const v=$('#patName').value;renderSheet();$('#patName').value=v;},
 patCreate:()=>{const bp=curBP(),cur=curPat(bp),s=UI.sheet;const name=($('#patName').value||'').trim()||'パターン'+(bp.pats.length+1);
  let p;if((s.from||(cur?'copy':'base'))==='copy'&&cur){p=JSON.parse(JSON.stringify(cur));p.id=uid();p.name=name;p.note='';p.toks.forEach(t=>t.id=uid());}else p=basePat(bp,name);
  bp.pats.splice(cur?bp.pats.indexOf(cur)+1:bp.pats.length,0,p);UI.bpat=p.id;UI.bsel='';UI.sheet=null;touchB();render();toast('「'+name+'」を追加しました');},
 patEdit:()=>openSheet({type:'patEdit'}),
 patSave:()=>{const pt=curPat();pt.name=($('#patName').value||'').trim()||pt.name;UI.sheet=null;touchB();render();},
 patDel:()=>{const bp=curBP(),pt=curPat(bp);if(!confirm(`パターン「${pt.name}」を削除しますか?`))return;const i=bp.pats.indexOf(pt);bp.pats.splice(i,1);UI.bpat=(bp.pats[i]||bp.pats[i-1]||{}).id||'';UI.sheet=null;touchB();render();},
 patDup:()=>{const bp=curBP(),pt=curPat(bp);const p=JSON.parse(JSON.stringify(pt));p.id=uid();p.name=pt.name+'(コピー)';p.toks.forEach(t=>t.id=uid());bp.pats.splice(bp.pats.indexOf(pt)+1,0,p);UI.bpat=p.id;UI.bsel='';touchB();render();toast('複製しました');},
 patMv:e=>{const bp=curBP(),pt=curPat(bp),i=bp.pats.indexOf(pt),j=i+(+e.dataset.v);if(j<0||j>=bp.pats.length)return;bp.pats.splice(i,1);bp.pats.splice(j,0,pt);touchB();render();},
 bMode:e=>{UI.bmode=e.dataset.v;UI.bsel='';render();},
 bColor:e=>{UI.bcolor=e.dataset.v;render();},
 lineUndo:()=>{const pt=curPat();pt.lines.pop();touchB();render();},
 lineClear:()=>{const pt=curPat();if(!confirm('このパターンの線を全部消しますか?'))return;pt.lines=[];touchB();render();},
 addOwn:e=>{const pt=curPat(),n=pt.toks.filter(t=>t.t==='own').length;pt.toks.push({id:uid(),t:'own',pid:e.dataset.id,x:r1(30+(n%5)*10),y:r1(150+(n%3)*6)});UI.bsel=pt.toks[pt.toks.length-1].id;UI.bpal=true;touchB();render();},
 addOpp:()=>{const pt=curPat(),n=pt.toks.filter(t=>t.t==='opp').length;pt.toks.push({id:uid(),t:'opp',lab:String(n+1),x:r1(30+(n%5)*10),y:r1(50-(n%3)*6)});UI.bsel=pt.toks[pt.toks.length-1].id;UI.bpal=true;touchB();render();},
 addBall:()=>{const pt=curPat();pt.toks.push({id:uid(),t:'ball',x:50,y:90});touchB();render();},
 tokDel:()=>{const pt=curPat();pt.toks=pt.toks.filter(t=>t.id!==UI.bsel);UI.bsel='';touchB();render();},
 tokLab:()=>{const pt=curPat(),t=pt.toks.find(x=>x.id===UI.bsel);if(!t)return;const v=prompt('相手の選手の表示(3文字まで。例: 4、L、エース)',t.lab||'');if(v==null)return;t.lab=v.trim().slice(0,3);touchB();render();},
 presToggle:()=>{UI.bpres=!UI.bpres;UI.bsel='';UI.bmode='move';window.scrollTo(0,0);render();},
 presMv:e=>{const bp=curBP(),i=bp.pats.indexOf(curPat(bp)),j=i+(+e.dataset.v);if(bp.pats[j]){UI.bpat=bp.pats[j].id;render();}},
};
const BCH={patNote:e=>{const pt=curPat();if(!pt)return;pt.note=e.value;touchB();}};
let BD=null;
function svgPt(svg,ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
document.addEventListener('pointerdown',ev=>{const svg=ev.target.closest&&ev.target.closest('#bsvg');if(!svg||UI.tab!=='board')return;const pt=curPat();if(!pt)return;
 const p=svgPt(svg,ev),mode=UI.bmode||'move';
 if(mode==='move'){const tg=ev.target.closest('[data-tok]');if(!tg){if(UI.bsel){UI.bsel='';render();}return;}
  const t=pt.toks.find(x=>x.id===tg.dataset.tok);if(!t)return;tg.parentNode.appendChild(tg);
  BD={t,el:tg,svg,dx:t.x-p.x,dy:t.y-p.y,sx:p.x,sy:p.y,moved:false};}
 else if(mode==='pen'){const el=document.createElementNS('http://www.w3.org/2000/svg','path');el.setAttribute('class','bpen');el.style.stroke=penV(UI.bcolor||'k');svg.appendChild(el);BD={pen:true,svg,el,pts:[[r1(p.x),r1(p.y)]]};}
 else{const ln=ev.target.closest('[data-line]');if(ln){pt.lines.splice(+ln.dataset.line,1);touchB();render();}return;}
 try{svg.setPointerCapture(ev.pointerId);}catch(e){}ev.preventDefault();});
document.addEventListener('pointermove',ev=>{if(!BD)return;const p=svgPt(BD.svg,ev);ev.preventDefault();
 if(BD.pen){const l=BD.pts[BD.pts.length-1];if(Math.hypot(p.x-l[0],p.y-l[1])>1.5){BD.pts.push([r1(p.x),r1(p.y)]);BD.el.setAttribute('d',pathD(BD.pts));}return;}
 if(Math.hypot(p.x-BD.sx,p.y-BD.sy)>1.2)BD.moved=true;if(!BD.moved)return;
 BD.t.x=r1(Math.min(BW+BM-3,Math.max(-BM+3,p.x+BD.dx)));BD.t.y=r1(Math.min(BH+BM-3,Math.max(-BM+3,p.y+BD.dy)));BD.el.setAttribute('transform',`translate(${BD.t.x} ${BD.t.y})`);});
function bEnd(){if(!BD)return;const d=BD;BD=null;const pt=curPat();
 if(d.pen){if(d.pts.length>2&&pt){pt.lines.push({c:UI.bcolor||'k',pts:d.pts});touchB();}render();return;}
 if(d.moved)touchB();else UI.bsel=UI.bsel===d.t.id?'':d.t.id;render();}
document.addEventListener('pointerup',bEnd);document.addEventListener('pointercancel',bEnd);
document.addEventListener('toggle',ev=>{if(ev.target.dataset&&ev.target.dataset.ch2==='bpal')UI.bpal=ev.target.open;},true);

Object.assign(ACT,BACT);Object.assign(CH,BCH);
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(!e)return;if(UI.shared&&!RO_OK.has(e.dataset.act))return;if(e.dataset.act!=='bgClose'&&ev.target.closest('[data-stop]')&&!e.closest('[data-stop]'))return;const f=ACT[e.dataset.act];if(f){if(e.dataset.act==='bgClose'&&ev.target!==e)return;f(e,ev);}});
document.addEventListener('change',ev=>{const e=ev.target.closest('[data-ch]');if(!e)return;if(UI.shared&&!RO_CH.has(e.dataset.ch))return;const f=CH[e.dataset.ch];if(f)f(e,ev);});
$('#fileIn').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const r=importData(JSON.parse(await f.text()));toast(`読み込みました: 追加${r.add}・更新${r.rep}${r.skip?'・変更なし'+r.skip:''}${r.tAdd?'・チーム追加'+r.tAdd:''}`);render();}catch(e){toast('読み込めませんでした: '+e.message);}});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
if(location.hash.startsWith('#s='))openShared(location.href).catch(e=>toast(e.message));
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#s='))openShared(location.href).catch(e=>toast(e.message));});
</script>
</body>
