<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="バレー記録">
<meta name="theme-color" content="#1F4E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>バレー記録</title>
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#1B2430;--sub:#5B6675;--line:#E2E6EC;--pri:#1F4E78;--pri2:#2563A8;--gain:#18794E;--gainBg:#E3F3EA;--loss:#B93A26;--lossBg:#FBE8E3;--neu:#5B6675;--neuBg:#ECEFF3;--warn:#8A5A00;--warnBg:#FFF1D6;--court:#E8D6B0;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0F1419;--card:#1A2129;--ink:#E7ECF2;--sub:#9AA6B4;--line:#2A333E;--pri:#7FB0E6;--pri2:#2F6FB5;--gain:#5ACB91;--gainBg:#15301F;--loss:#F08B77;--lossBg:#3A1E18;--neu:#A3ACB8;--neuBg:#252D37;--warn:#F0BE5C;--warnBg:#3A2D12;--court:#4A3F2C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
#app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 28px}
h1{font-size:22px;margin:0;line-height:1.3}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:14px;margin:14px 0 6px;color:var(--sub);font-weight:600}
p{margin:6px 0}
.sub{color:var(--sub);font-size:13px}
.top{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--neuBg);font-weight:600;font-size:15px}
.btn.pri{background:var(--pri2);color:#fff}
.btn.danger{background:var(--lossBg);color:var(--loss)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.back{font-weight:600;color:var(--pri);padding:8px 4px;min-height:44px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px;width:100%}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--pri2)}
label.f{display:block;margin:10px 0 0}
label.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.seg{display:flex;background:var(--neuBg);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;color:var(--sub);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px}
.tabs button{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;background:var(--neuBg);font-weight:600;font-size:14px;color:var(--sub)}
.tabs button.on{background:var(--pri2);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neuBg);color:var(--sub)}
.pill.g{background:var(--gainBg);color:var(--gain)}.pill.l{background:var(--lossBg);color:var(--loss)}.pill.w{background:var(--warnBg);color:var(--warn)}
.mcard{display:block;width:100%;text-align:left}
.mcard .t{font-weight:700;font-size:16px;margin:2px 0}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
/* scoreboard */
.board{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 -16px;padding:calc(env(safe-area-inset-top) + 6px) 16px 8px}
.sc{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.sc .team{font-size:12px;color:var(--sub);font-weight:600}
.sc .num{font-size:44px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.sc .mid{text-align:center;padding:0 10px;font-size:13px;color:var(--sub);font-weight:600}
.sc .r{text-align:right}
.srv{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:14px;flex-wrap:wrap}
.srv .who{font-weight:800}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gain);margin-right:4px;vertical-align:1px}
.dot.o{background:var(--loss)}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px}
.ptitle b{font-size:14px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{min-height:50px;border-radius:12px;padding:7px 10px;font-weight:700;font-size:15px;text-align:left;line-height:1.25}
.pbtn small{display:block;font-weight:500;font-size:11px;opacity:.75}
.pbtn.g{background:var(--gainBg);color:var(--gain)}
.pbtn.l{background:var(--lossBg);color:var(--loss)}
.pbtn.n{background:var(--neuBg);color:var(--ink)}
.pbtn.dim{opacity:.5}
.pane .pbtn{min-height:44px;font-size:14px}
.evhead{background:var(--neuBg);border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.pbtn:active,.chip:active,.btn:active{transform:scale(.97)}
.banner{border-radius:var(--r);padding:12px 14px;margin:10px 0;font-weight:600}
.banner.g{background:var(--gainBg);color:var(--gain)}.banner.w{background:var(--warnBg);color:var(--warn)}.banner.n{background:var(--neuBg)}
.log{list-style:none;margin:0;padding:0}
.log li button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.log .s{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px}
.log .k{flex:1}
.log .g{color:var(--gain)}.log .l{color:var(--loss)}
/* sheet */
.shbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.pane{background:var(--card);width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.pane h2{margin:0 0 4px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.chip{min-height:60px;border-radius:12px;background:var(--neuBg);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}
.chip small{font-weight:500;color:var(--sub);font-size:11px}
.chip.srv{outline:2px solid var(--pri2)}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .l{font-size:12px;color:var(--sub);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .d{font-size:12px;color:var(--sub)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.2em;gap:8px;align-items:center;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:12px;background:var(--neuBg);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .fill.g{background:var(--gain)}.bar .fill.l{background:var(--loss)}
.bar .c{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar.grp{font-weight:700}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--neuBg);font-weight:600;color:var(--sub);font-size:11px;white-space:normal;min-width:4.2em}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{background:var(--neuBg)}
tr.tot td{font-weight:700;background:var(--neuBg)}
td.g{color:var(--gain);font-weight:700}td.l{color:var(--loss);font-weight:700}
/* court */
.court{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:var(--court);padding:8px;border-radius:12px}
.net{grid-column:1/-1;height:8px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 7px);opacity:.55}
.cell{background:var(--card);border-radius:9px;min-height:56px;font-size:10px;text-align:center;padding:4px 2px;display:flex;flex-direction:column;justify-content:center;color:var(--sub);line-height:1.25}
.cell b{font-size:13px;color:var(--ink)}
.cell.on{outline:2px solid var(--gain)}
.gap{visibility:hidden}
.olist{display:grid;grid-template-columns:2.2em 1fr;gap:4px 8px;align-items:center}
.olist .no{font-weight:800;text-align:center;background:var(--neuBg);border-radius:8px;padding:4px 0}
.ok{color:var(--gain);font-weight:700}.ng{color:var(--loss);font-weight:700}
.prow{display:grid;grid-template-columns:4.2em 1fr 1fr 40px;gap:6px;align-items:center;margin-bottom:6px}
.x{min-height:44px;color:var(--loss);font-weight:700}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.flow{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px 0}
.fg{display:grid;row-gap:3px;width:max-content}
.fg .lb{position:sticky;left:0;z-index:1;background:var(--card);font-size:11px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0 4px}
.fc{width:20px;height:22px;margin:0 1px;border-radius:4px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;padding:0}
.fc.g.s{background:var(--gain);color:var(--card)}.fc.g.m{background:var(--gainBg);color:var(--gain);border:1px dashed var(--gain)}
.fc.l.s{background:var(--loss);color:var(--card)}.fc.l.m{background:var(--lossBg);color:var(--loss);border:1px dashed var(--loss)}
.fsvg line.z{stroke:var(--line);stroke-width:1}.fsvg path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 0 2px;align-items:center}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
details.mf{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 12px;margin-bottom:8px}
details.mf>summary{list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:44px}
details.mf>summary::-webkit-details-marker,details.sf>summary::-webkit-details-marker{display:none}
details.mf>summary::after,details.sf>summary::after{content:'▼';font-size:10px;color:var(--sub);flex:0 0 auto}
details[open].mf>summary::after,details[open].sf>summary::after{content:'▲'}
details.sf{border-top:1px solid var(--line);padding:2px 0 8px}
details.sf>summary{list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:40px;font-size:14px}
ul.notes{margin:0;padding-left:1.2em}ul.notes li{margin:4px 0}
.otbl td:first-child button{font-weight:700;color:var(--pri);text-align:left;padding:0;min-height:0}
textarea.ai{width:100%;font:inherit;font-size:13px;line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--neuBg);color:var(--ink);height:38vh}
button.kpi.kb{text-align:left;width:100%;display:block}
button.kpi.kb .d{color:var(--pri)}
button.bar{width:100%;text-align:left;padding:2px 0}
.tourbar{margin:-4px 0 0}
details.tour>summary{min-height:56px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gbtn{min-height:68px;border-radius:12px;font-weight:800;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;border:2px solid transparent}
.gbtn small{font-size:10px;font-weight:600;margin-top:4px;opacity:.85}
.gbtn.gA{background:var(--gainBg);color:var(--gain)}.gbtn.gB{background:var(--warnBg);color:var(--warn)}.gbtn.gC{background:var(--lossBg);color:var(--loss)}
.gbtn.on{border-color:currentColor}
.mcheck{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
body.capture #app{width:960px;max-width:none;padding:24px}
body.capture .print-only{display:block}
body.capture .noprint,body.capture nav#nav{display:none!important}
body.capture .tbl,body.capture .flow{overflow:visible}
body.capture .board,body.capture td:first-child,body.capture th:first-child,body.capture .fg .lb{position:static}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
#toast.top{bottom:auto;top:calc(env(safe-area-inset-top) + 10px)}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav#nav button{flex:1;padding:7px 0 5px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:600}
nav#nav button.on{color:var(--pri2)}
nav#nav svg{width:24px;height:24px}
.print-only{display:none}
@media print{
 nav#nav,.noprint,#toast{display:none!important}
 body{padding:0;background:#fff;color:#000}
 #app{padding:0;max-width:none}
 .card,.kpi,.tbl{break-inside:avoid;border-color:#ccc}
 .tbl{overflow:visible}
 .print-only{display:block}
 .board{position:static}
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" class="noprint"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<script>
'use strict';
const APPV='1.5.2';
const STORE='volleyRec.v1';
const POS9=['レフト','中打ち(レフト)','セッター','中打ち(ライト)','ライト','ハーフ','バックレフト','バックセンター','バックライト'];
// key, label, 得失, 分類, 選手入力(req=必須/opt=任意/auto=サーバー自動/none=不要/sub), 表示(any/self=自サーブ中/opp=相手サーブ中), 限定(nine/practice)
const PLAYS=[
 ['spike','スパイク決定','得','決定','req','any'],
 ['feint','フェイント・押し込み','得','決定','req','any'],
 ['block','ブロック決定','得','決定','req','any'],
 ['blockout','ブロックアウト決定','得','決定','req','any'],
 ['ace','サーブ得点(エース)','得','決定','auto','self'],
 ['o_serve','相手サーブミス','得','相手ミス','none','opp'],
 ['o_spike','相手スパイクミス','得','相手ミス','none','any'],
 ['o_recv','相手レシーブミス','得','相手ミス','none','any'],
 ['o_foul','相手反則(ネット等)','得','相手ミス','none','any'],
 ['o_other','相手その他ミス','得','相手ミス','none','any'],
 ['o_ace','相手サービスエース','失','被決定','opt','opp'],
 ['r_serve','サーブレシーブミス','失','自ミス','req','opp'],
 ['r_spike','スパイクレシーブミス','失','自ミス','req','any'],
 ['r_other','その他のレシーブミス','失','自ミス','req','any'],
 ['serve_miss','サーブミス','失','自ミス','auto','self'],
 ['spike_miss','スパイクミス(アウト・ネット)','失','自ミス','req','any'],
 ['connect','つなぎ・トスミス','失','自ミス','req','any'],
 ['foul','自反則(ネットタッチ等)','失','自ミス','opt','any'],
 ['blocked','被ブロック(止められた)','失','被決定','opt','any'],
 ['blockout_x','被ブロックアウト','失','被決定','opt','any'],
 ['spiked','被スパイク決定','失','被決定','opt','any'],
 ['feinted','被フェイント決定','失','被決定','opt','any'],
 ['l_other','その他(失点)','失','その他','opt','any'],
 ['serve1','サーブ1本目ミス','—','記録のみ','auto','any','nine'],
 ['rcv','サーブカット','—','記録のみ','rcv','opp'],
 ['sub','メンバー交代','—','','sub','any'],
 ['set_end','セット終了(時間切れ等)','—','','none','any','practice']
];
const P={};PLAYS.forEach(a=>P[a[0]]={k:a[0],label:a[1],res:a[2],cls:a[3],need:a[4],ctx:a[5],only:a[6]||''});
const GAIN=PLAYS.filter(a=>a[2]==='得').map(a=>a[0]);
const LOSS=PLAYS.filter(a=>a[2]==='失').map(a=>a[0]);
const SCORE_K=['spike','feint','block','blockout','ace'];
const MISS_K=['serve_miss','r_serve','r_spike','r_other','spike_miss','connect','foul'];
const OPP_K=['o_ace','blocked','blockout_x','spiked','feinted','o_serve','o_spike','o_recv','o_foul','o_other'];
const POS6=['レフト','センター','ライト','セッター','前衛','後衛'];
const GRADE={A:'セッターほぼ動かず・全攻撃OK',B:'セッター1〜2歩・速攻/サイド可',C:'セッター大きく移動・オープン/2段'};
const GRADE_FULL={A:'Aカット: セッターが定位置(ほぼ動かず)からトスを上げられる最高の返球。クイック・平行・バックアタックなど、すべての攻撃を選べる',B:'Bカット: セッターが1〜2歩動かされるが、十分にコントロールできる返球。クイック(Bクイック等)やサイドへのトスが使え、合格点の攻撃ができる',C:'Cカット: セッターが大きく移動したり、ネットから大きく離れたりする難しい返球。コンビネーションが使えず、オープン攻撃(高いトス)や2段トス中心になる'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pct=(a,b)=>b?(Math.round(a/b*1000)/10).toFixed(1)+'%':'-';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>s?String(s).replace(/-/g,'/'):'';
const isNine=m=>m.rule!=='six';
const N=m=>isNine(m)?9:6;
const plabel=(k,nine)=>k==='serve_miss'?(nine?'サーブ2本目ミス':'サーブミス'):(P[k]?P[k].label:k);
const ruleLabel=m=>(isNine(m)?'9人制':'6人制小学生')+' '+(m.kind==='official'?'公式戦':'練習試合');

/* ---------- storage ---------- */
function blankDB(){return {v:2,teams:[],matches:[]}}
function newTeam(name){return {id:uid(),name:name||'チーム'+(DB&&DB.teams?DB.teams.length+1:1),players:[]}}
function migrate(d){
 if(!Array.isArray(d.teams)){d.teams=[];if((d.players&&d.players.length)||d.team)d.teams.push({id:uid(),name:d.team||'チーム1',players:d.players||[]});}
 delete d.players;delete d.team;
 if(!d.teams.length)d.teams.push({id:uid(),name:'チーム1',players:[]});
 d.matches.forEach(m=>{if(!m.teamId||!d.teams.some(t=>t.id===m.teamId))m.teamId=d.teams[0].id;});
 if(!Array.isArray(d.tours))d.tours=[];
 if(!d.oppInfo||typeof d.oppInfo!=='object'||Array.isArray(d.oppInfo))d.oppInfo={};
 d.matches.forEach(m=>{if(m.tourId&&!d.tours.some(t=>t.id===m.tourId))delete m.tourId;});
 d.v=2;return d;
}

 }

 if(!DB.matches.length)return h+'<div class="empty">まだ試合がありません。<br>「＋ 新しい試合」から始めましょう。</div>';
 h+='<div class="card">'+filterUI(f,'hf')+'</div>';

 if(!list.length)return h+'<div class="empty">条件に合う試合がありません。</div>';
 const card=(m,compact)=>{const R=replay(m);const res=resultLabel(m,R);const cls=/勝ち/.test(res)?'g':/負け/.test(res)?'l':'';const op=oppsOf(m);
  return `<button class="card mcard" data-act="openMatch" data-id="${m.id}"${compact?' style="margin-bottom:6px"':''}><div class="row" style="justify-content:space-between"><span class="sub" style="flex:0 0 auto">${esc(fmtD(m.date))}</span><span style="flex:0 0 auto">${DB.teams.length>1&&!compact?`<span class="pill">${esc(teamName(m.teamId))}</span> `:''}<span class="pill">${esc(ruleLabel(m))}</span></span></div><div class="t">${compact?(op.length?'vs '+esc(op.join('・')):'(相手未入力)'):esc(mTitle(m))}</div><div class="row" style="justify-content:space-between"><span class="sub">${compact?esc(m.title||''):(op.length?'vs '+esc(op.join('・')):'')}</span><span style="flex:0 0 auto" class="pill ${cls}">${esc(res)}</span></div></button>`;};
 const items=[],seen=new Set();
 list.forEach(m=>{if(m.tourId&&tourOf(m.tourId)){if(seen.has(m.tourId))return;seen.add(m.tourId);const ms=list.filter(x=>x.tourId===m.tourId).sort((a,b)=>(a.created||0)-(b.created||0));items.push({tour:tourOf(m.tourId),ms,date:ms.map(x=>x.date||'').sort().pop()});}else items.push({m,ms:[m],date:m.date||''});});
 let cur='',firstTour=true;
 items.forEach(it=>{
  const mk=(it.date||'').slice(0,7);
  if(mk!==cur){cur=mk;const g=items.filter(x=>(x.date||'').slice(0,7)===mk);let sw=0,sl=0,nm_=0;g.forEach(x=>x.ms.forEach(y=>{nm_++;replay(y).sums.forEach(t=>{if(t.done&&t.res==='○')sw++;else if(t.done&&t.res==='×')sl++;});}));
   h+=`<h2 style="display:flex;justify-content:space-between;align-items:baseline">${mk?esc(mk.slice(0,4)+'年'+(+mk.slice(5))+'月'):'日付なし'}<span class="sub" style="font-weight:600">${nm_}試合・セット${sw}勝${sl}敗</span></h2>`;}
  if(!it.tour){h+=card(it.m,false);return;}

  const ds=[...new Set(it.ms.map(y=>y.date).filter(Boolean))].sort();
  h+=`<details class="mf tour"${firstTour?' open':''}><summary><span>🏆 <b>${esc(t.name)}</b><br><span class="sub">${esc(fmtD(ds[0]||t.date))}${ds.length>1?'〜'+esc(fmtD(ds[ds.length-1]).slice(5)):''}・${it.ms.length}試合・${mw+ml?`試合${mw}勝${ml}敗・`:''}セット${sw}勝${sl}敗${DB.teams.length>1?'・'+esc(teamName(t.teamId)):''}</span></span></summary><div style="padding:4px 0 8px">`+it.ms.map(y=>card(y,true)).join('')+`<div class="pgrid noprint">${UI.shared?'':`<button class="btn pri" data-act="nextTour" data-tour="${t.id}">＋ 次の試合</button>`}<button class="btn" data-act="tourAgg" data-tour="${t.id}">大会の集計 ›</button>${UI.shared?'':`<button class="btn sm" data-act="tourEdit" data-tour="${t.id}">大会名・削除</button>`}</div></div></details>`;
  firstTour=false;});

function court(m,s,srvSet){

 cells.forEach(pi=>{if(pi===null){h+='<div class="cell gap"></div>';return;}const id=s.pos[pi];const sn=id?s.order.indexOf(id)+1:0;h+=`<div class="cell ${srvSet&&id===srvSet?'on':''}">${esc(POS9[pi])}<b>${esc(id?nm(m,id):'-')}</b>${sn?`サーブ${sn}番`:''}</div>`;});
 return h+'</div>';
}

function ctxFor(m,R,s){const idx=s.mode==='ins'?s.at:(s.mode==='edit'||s.mode==='editP')?s.i:null;
 if(idx!==null){const r=R.rows.find(x=>x.i===idx);if(r)return {order:r.ord,pos:r.posB,server:r.server,si:r.si};}
 return {order:R.cur.order,pos:R.cur.pos,server:R.cur.server,si:R.cur.si};}
function applyEv(s,k,p,inn,x){
 if(!s.mode){commit(k,p,inn,x);return;}
 const m=curM();let msg;
 if(s.mode==='edit'){const old=m.events[s.i];const ne={k,p:p||null,in:inn||null,t:old.t||Date.now()};if(old.memo)ne.memo=old.memo;m.events[s.i]=Object.assign(ne,x||{});msg='変更しました';}
 else if(s.mode==='editP'){const ev=m.events[s.i];ev.p=p||null;if(ev.k==='sub')ev.in=inn||null;delete ev.op;if(x)Object.assign(ev,x);msg='変更しました';}
 else{m.events.splice(s.at,0,Object.assign({k,p:p||null,in:inn||null,t:Date.now()},x||{}));msg='追加しました';}
 touch(m);UI.sheet=null;render();toast(msg);
}
function openSheet(o){UI.sheet=o;renderSheet();}
function closeSheet(){const s=UI.sheet;if(s&&s.type==='rcv'&&!s.mode){const m=curM();if(m)UI.rcvSkip=m.id+':'+m.events.length;}UI.sheet=null;renderSheet();}
function rcvNeeded(){
 if(UI.shared||UI.sheet||UI.tab!=='match'||UI.mtab!=='rec')return false;
 const m=curM();if(!m||m.rcvOn===false)return false;
 if(UI.rcvSkip===m.id+':'+m.events.length)return false;
 const R=replay(m),c=R.cur;if(R.over||R.needSet||!orderReady(m,c.si))return false;
 return c.side==='相'&&!c.rcv;}
function needPick(m,k,si){const p=P[k];if(p.need==='req'||p.need==='opt')return true;return p.need==='none'&&OPP_K.includes(k)&&oppPlayers(setOpp(m,si)).length>0;}
function ensureOI(name){if(!DB.oppInfo[name])DB.oppInfo[name]={players:[],memo:''};if(!DB.oppInfo[name].players)DB.oppInfo[name].players=[];return DB.oppInfo[name];}
function nextInTour(tid){
 const ms=tourMatches(tid),last=ms[ms.length-1];if(!last)return;
 const m={id:uid(),teamId:last.teamId,tourId:tid,rule:last.rule,kind:last.kind,date:today(),title:'',opp:'',members:last.members.map(p=>Object.assign({},p)),sets:[],events:[],rcvOn:last.rcvOn,created:Date.now(),updated:Date.now()};
 const cnt=m.kind==='official'?3:1;const base=last.sets[0]||{};
 for(let i=0;i<cnt;i++){const s=blankSet(m,i);const ls=last.sets[i];if(ls){s.target=ls.target;s.deuce=ls.deuce;s.first=ls.first;}s.order=(base.order||s.order).slice();if(isNine(m))s.pos=(base.pos||s.pos).slice();m.sets.push(s);}
 DB.matches.push(m);save();UI.mid=m.id;UI.tab='match';UI.mtab='rec';UI.aset='all';UI.sheet={type:'opp',si:0};window.scrollTo(0,0);render();
}

function commit(k,p,inn,x){const m=curM();m.events.push(Object.assign({k,p:p||null,in:inn||null,t:Date.now()},x||{}));touch(m);UI.sheet=null;render();
 const R=replay(m),r=R.lastRow;if(!r)return;const who=r.k==='sub'?`${nm(m,r.out)}→${nm(m,r.inn)}`:nm(m,r.who);
 toast(`${r.res==='得'?'＋1 ':r.res==='失'?'相手＋1 ':''}${plabel(k,isNine(m))}${r.k==='rcv'?' '+(r.g||''):''}${who?' '+who:''}${r.op?' 相手'+oppPlLabel(r.opp,r.op):''}  ${r.us}-${r.them}`);}
function newMatchObj(rule,kind,teamId,sel,tourId){
 const T=teamOf(teamId);
 const m={id:uid(),teamId:T.id,rule,kind,date:today(),title:'',opp:'',members:T.players.filter(p=>!sel||sel.includes(p.id)).map(p=>({id:p.id,num:p.num,name:p.name,pos:p.pos||''})),sets:[],events:[],created:Date.now(),updated:Date.now()};
 const cnt=kind==='official'?3:1;for(let i=0;i<cnt;i++)m.sets.push(blankSet(m,i));
 if(tourId)m.tourId=tourId;
 const prev=(tourId&&tourMatches(tourId).filter(x=>x.rule===rule).pop())||DB.matches.filter(x=>x.rule===rule&&x.teamId===T.id).sort((a,b)=>b.created-a.created)[0];
 if(prev&&prev.sets[0]){const ids=new Set(m.members.map(p=>p.id));const ok=id=>ids.has(id)?id:'';m.sets.forEach(s=>{s.order=prev.sets[0].order.map(ok);if(isNine(m))s.pos=(prev.sets[0].pos||[]).map(ok);});}
 return m;

 (Array.isArray(d.tours)?d.tours:[]).forEach(t=>{if(!t||!t.id)return;const team=map[t.teamId]||t.teamId;let loc=DB.tours.find(x=>x.id===t.id)||DB.tours.find(x=>x.name===t.name&&x.teamId===team&&x.date===t.date);if(!loc){loc={id:t.id,name:t.name||'大会',date:t.date||'',teamId:team};DB.tours.push(loc);}tmap[t.id]=loc.id;});

const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
async function zip(u8,inflate){const cs=inflate?new DecompressionStream('deflate-raw'):new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(cs.readable).arrayBuffer());}

 undo:()=>{const m=curM();if(!m.events.length)return;const R=replay(m);const r=R.lastRow;m.events.pop();touch(m);render();toast('取り消しました'+(r?': '+plabel(r.k,isNine(m)):''));},
 wake:()=>setWake(!UI.wake),
 evMenu:e=>openSheet({type:'ev',i:+e.dataset.i}),
 delEv:e=>{const m=curM();m.events.splice(+e.dataset.i,1);touch(m);UI.sheet=null;render();toast('削除しました');},
 addSet:()=>{const m=curM();const prev=m.sets[m.sets.length-1];m.sets.push(blankSet(m,m.sets.length,prev));touch(m);UI.open=m.sets.length-1;if(UI.mtab!=='setup'){UI.mtab='rec';}render();openSheet({type:'opp',si:m.sets.length-1});},
 delSet:e=>{const m=curM();if(!confirm('このセットを削除しますか?'))return;m.sets.splice(+e.dataset.i,1);touch(m);UI.open=-1;render();},
 gotoSetup:e=>{UI.mtab='setup';UI.open=+e.dataset.si;render();},
 openSet:e=>{const i=+e.dataset.i;UI.open=UI.open===i?-1:i;render();},
 sfirst:e=>{const m=curM();m.sets[+e.dataset.i].first=e.dataset.v;touch(m);render();},
 sdeuce:e=>{const m=curM();m.sets[+e.dataset.i].deuce=e.dataset.v==='1';touch(m);render();},
 copyPrev:e=>{const m=curM(),i=+e.dataset.i;m.sets[i].order=m.sets[i-1].order.slice();m.sets[i].pos=(m.sets[i-1].pos||[]).slice();touch(m);render();},
 setRule:e=>{const m=curM();if(m.events.length)return;m.rule=e.dataset.v;m.sets=m.sets.map((s,i)=>blankSet(m,i));touch(m);render();},
 setKind:e=>{const m=curM();if(m.events.length)return;m.kind=e.dataset.v;const cnt=m.kind==='official'?3:1;const old=m.sets;m.sets=[];for(let i=0;i<cnt;i++){const s=blankSet(m,i);if(old[i]){s.order=old[i].order;s.pos=old[i].pos;}m.sets.push(s);}touch(m);render();},
 addGuest:()=>{const m=curM();const v=($('#guestName').value||'').trim();if(!v)return;if(m.members.some(p=>p.name===v)){toast('同じ名前がいます');return;}m.members.push({id:uid(),num:'',name:v,pos:''});touch(m);render();},
 delMatch:()=>{const m=curM();if(!confirm(`「${m.title||'この試合'}」を削除しますか?元に戻せません。`))return;DB.matches=DB.matches.filter(x=>x.id!==m.id);save();UI.tab='home';render();},
 sendMatch:()=>{const m=curM();shareFile(`試合_${fmtD(m.date).replace(/\//g,'')}_${fileSafe(m.title||m.opp)}.json`,matchPayload([m]),'application/json');},
 csvMatch:()=>{const m=curM();shareFile(`記録_${fmtD(m.date).replace(/\//g,'')}_${fileSafe(m.title)}.csv`,csvOf([m]),'text/csv');},
 shareText:()=>{const m=curM();const R=replay(m);const sel=UI.aset==='all'?null:+UI.aset;const rows=sel===null?R.rows:R.rows.filter(r=>r.si===sel);const sums=sel===null?R.sums:R.sums.filter(s=>s.si===sel);
  shareText(summaryText(`【${fmtD(m.date)} ${mTitle(m)}】${oppsOf(m).length?' vs '+oppsOf(m).join('・'):''} ${resultLabel(m,R)}`,rows,sums,isNine(m)));},
 shareOrder:()=>{const m=curM();const L=[`【オーダー ${fmtD(m.date)} ${m.title||''}】`];m.sets.forEach((s,i)=>{L.push(`■第${i+1}セット${setOpp(m,i)?' vs '+setOpp(m,i):''}(${s.first==='自'?'自チーム':'相手'}サーブから)`);L.push('サーブ順: '+s.order.map((id,k)=>`${k+1}.${nm(m,id)||'-'}`).join(' '));if(isNine(m))L.push('配置: '+POS9.map((p,k)=>`${p}=${nm(m,s.pos[k])||'-'}`).join(' / '));});shareText(L.join('\n'));},
 shareAgg:()=>{const A=aggRows();const f=UI.agg;shareText(summaryText(`【集計 ${(f.from||f.to)?(fmtD(f.from)||'最初')+'〜'+(fmtD(f.to)||'今日'):'全期間'}${f.opp?' vs '+f.opp:''}】${A.mc}試合`,A.rows,[],f.rule!=='six'));},
 print:()=>{try{window.print();}catch(e){toast('印刷できませんでした');}},
 flt:e=>{UI[e.dataset.f][e.dataset.k]=e.dataset.v;saveUI();render();},
 fper:e=>{const f=UI[e.dataset.f],v=e.dataset.v;f.period=v;if(v!=='custom'){const r=periodRange(v);f.from=r[0];f.to=r[1];}saveUI();render();},
 toAgg:()=>{UI.agg.set='all';UI.agg.opp='';if(UI.shared){Object.assign(UI.agg,{period:UI.hf.period,from:UI.hf.from,to:UI.hf.to,kind:UI.hf.kind});if(UI.hf.rule!=='all')UI.agg.rule=UI.hf.rule;if(UI.hf.team!=='all')UI.agg.team=UI.hf.team;UI.tab='agg';render();return;}Object.assign(UI.agg,{team:UI.hf.team,rule:UI.hf.rule==='all'?'nine':UI.hf.rule,kind:UI.hf.kind,period:UI.hf.period,from:UI.hf.from,to:UI.hf.to,opp:''});if(UI.agg.team==='all'&&DB.teams.length>1)UI.agg.team=DB.teams[0].id;saveUI();UI.tab='agg';window.scrollTo(0,0);render();},
 addTeam:()=>{const t=newTeam();DB.teams.push(t);UI.tid=t.id;save();saveUI();render();toast('チームを追加しました。名前を入れてください');},
 selTeam:e=>{UI.tid=e.dataset.v;saveUI();render();},
 delTeam:()=>{const t=teamOf(UI.tid);const n=DB.matches.filter(m=>m.teamId===t.id).length;if(n){alert(`このチームの試合が${n}件あるので削除できません。先に試合を削除するか、そのまま残してください。`);return;}if(!confirm(`「${t.name}」を削除しますか?`))return;DB.teams=DB.teams.filter(x=>x!==t);fixUI();save();saveUI();render();},
 addPlayer:()=>{const t=teamOf(UI.tid);const mx=t.players.reduce((a,p)=>Math.max(a,+p.num||0),0);t.players.push({id:uid(),num:mx+1,name:'選手'+(t.players.length+1),pos:''});save();render();},
 delPlayer:e=>{const t=teamOf(UI.tid);const p=t.players.find(x=>x.id===e.dataset.id);if(!p||!confirm(`${p.name} を削除しますか?(過去の試合の記録は残ります)`))return;t.players=t.players.filter(x=>x!==p);save();render();},
 pickFile:()=>$('#fileIn').click(),
 backup:()=>shareFile(`バレー記録_バックアップ_${today().replace(/-/g,'')}.json`,JSON.stringify({app:'volley-rec',v:2,type:'backup',exported:Date.now(),teams:DB.teams,tours:DB.tours,oppInfo:DB.oppInfo,matches:DB.matches}),'application/json'),
 csvAll:()=>shareFile(`バレー記録_全記録_${today().replace(/-/g,'')}.csv`,csvOf(DB.matches),'text/csv'),
 wipe:()=>{if(!confirm('すべての試合とメンバーを削除します。よろしいですか?'))return;if(!confirm('本当に削除しますか?元に戻せません。'))return;DB=migrate(blankDB());fixUI();save();render();},
};
const CH={
 mf:e=>{const m=curM();m[e.dataset.k]=e.value.trim?e.value.trim():e.value;touch(m);render();},
 sf:e=>{const m=curM(),s=m.sets[+e.dataset.i];s[e.dataset.k]=e.dataset.k==='target'?Math.max(1,parseInt(e.value)||21):e.value.trim();touch(m);render();},
 sord:e=>{const m=curM();m.sets[+e.dataset.i].order[+e.dataset.k]=e.value;touch(m);render();},
 spos:e=>{const m=curM();m.sets[+e.dataset.i].pos[+e.dataset.k]=e.value;touch(m);render();},
 memToggle:e=>{const m=curM(),id=e.dataset.id;if(e.checked){const p=teamOf(m.teamId).players.find(x=>x.id===id);if(p&&!m.members.some(x=>x.id===id))m.members.push({id:p.id,num:p.num,name:p.name,pos:p.pos||''});}else{const used=m.events.some(v=>v.p===id||v.in===id)||m.sets.some(s=>s.order.includes(id)||(s.pos||[]).includes(id));if(used){toast('記録やサーブ順で使われているので外せません');e.checked=true;return;}m.members=m.members.filter(x=>x.id!==id);}touch(m);render();},
 af:e=>{UI.agg[e.dataset.k]=e.value;saveUI();render();},
 nmSel:e=>{const s=UI.sheet,id=e.dataset.id;s.sel=(s.sel||[]).filter(x=>x!==id);if(e.checked)s.sel.push(id);renderSheet();},
 fdate:e=>{UI[e.dataset.f][e.dataset.k]=e.value;saveUI();render();},
 nmTour:e=>{const s=UI.sheet;s.tour=e.value;if(e.value&&e.value!=='new'){const pm=tourMatches(e.value).pop();if(pm){s.rule=pm.rule;s.kind=pm.kind;s.sel=pm.members.map(p=>p.id).filter(id=>teamOf(s.team).players.some(x=>x.id===id));}}renderSheet();},
 nmTourName:e=>{UI.sheet.tourName=e.value;},
 mTour:e=>{const m=curM();let v=e.value;if(v==='new'){const n=(prompt('大会名を入れてください','')||'').trim();if(!n){render();return;}const t={id:uid(),name:n,date:m.date||today(),teamId:m.teamId};DB.tours.push(t);v=t.id;}if(v)m.tourId=v;else delete m.tourId;touch(m);render();},
 rcvOn:e=>{const m=curM();m.rcvOn=e.checked;touch(m);},
 ftour:e=>{const f=UI[e.dataset.f];f.tour=e.value||'all';if(f.tour!=='all'){f.period='all';f.from='';f.to='';const t=tourOf(f.tour);if(t&&f.team!=='all')f.team=t.teamId;}saveUI();render();},
 oiMemo:e=>{ensureOI(UI.sheet.name).memo=e.value;save();},
 oiF:e=>{const inf=ensureOI(UI.sheet.name);const p=inf.players.find(x=>x.id===e.dataset.id);if(!p)return;let v=e.value.trim();if(e.dataset.k==='num')v=v===''?'':(isNaN(+v)?v:+v);p[e.dataset.k]=v;save();},
 nmTeam:e=>{UI.sheet.team=e.value;UI.sheet.sel=[];UI.sheet.tour='';const lm=DB.matches.filter(m=>m.teamId===e.value).sort((a,b)=>b.created-a.created)[0];if(lm)UI.sheet.rule=lm.rule;renderSheet();},
 team:e=>{const t=teamOf(UI.tid);const v=e.value.trim();if(!v){render();return;}t.name=v;save();render();},
 pf:e=>{const t=teamOf(UI.tid);const p=t.players.find(x=>x.id===e.dataset.id);if(!p)return;const k=e.dataset.k;let v=e.value.trim();if(k==='name'){if(!v){render();return;}if(t.players.some(x=>x!==p&&x.name===v)){toast('同じ名前がいます');render();return;}}if(k==='num')v=v===''?'':(isNaN(+v)?v:+v);p[k]=v;save();},
};
const RO_OK=new Set(['tourAgg','who','aggOpp','ai','aiCopy','aiClaude','aiShare','nav','goHome','openMatch','mtab','aset','closeSheet','bgClose','flt','fper','toAgg','logAll','shareText','shareOrder','shareAgg','makeImg','imgSend','tip','shImport','shClose','print']);
const RO_CH=new Set(['af','fdate','ftour']);
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(!e)return;if(UI.shared&&!RO_OK.has(e.dataset.act))return;if(e.dataset.act!=='bgClose'&&ev.target.closest('[data-stop]')&&!e.closest('[data-stop]'))return;const f=ACT[e.dataset.act];if(f){if(e.dataset.act==='bgClose'&&ev.target!==e)return;f(e,ev);}});
document.addEventListener('change',ev=>{const e=ev.target.closest('[data-ch]');if(!e)return;if(UI.shared&&!RO_CH.has(e.dataset.ch))return;const f=CH[e.dataset.ch];if(f)f(e,ev);});
$('#fileIn').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const r=importData(JSON.parse(await f.text()));toast(`読み込みました: 追加${r.add}・更新${r.rep}${r.skip?'・変更なし'+r.skip:''}${r.tAdd?'・チーム追加'+r.tAdd:''}`);render();}catch(e){toast('読み込めませんでした: '+e.message);}});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
if(location.hash.startsWith('#s='))openShared(location.href).catch(e=>toast(e.message));
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#s='))openShared(location.href).catch(e=>toast(e.message));});
</script>
</body>
</html>
